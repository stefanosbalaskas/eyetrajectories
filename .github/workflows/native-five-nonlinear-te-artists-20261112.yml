name: Native five nonlinear and TE sensitivity source scientific artists
on:
  pull_request:
    paths:
      - "R/native-five-nonlinear-te-sensitivity-artists.R"
      - "R/native-math-contracts-diagnostics.R"
      - "R/native-transfer-entropy-visual.R"
      - "tests/testthat/test-native-five-nonlinear-te-sensitivity-artists-20261112.R"
      - "tests/testthat/test-native-math-contracts-diagnostics.R"
      - "tests/testthat/test-native-transfer-entropy-visual.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_kantz_sensitivity.json"
      - "docs/source_contract_reviews/plot_lyapunov_sensitivity.json"
      - "docs/source_contract_reviews/plot_windowed_rqa_sensitivity.json"
      - "docs/source_contract_reviews/plot_transfer_entropy_circular_shift_test.json"
      - "docs/source_contract_reviews/plot_conditional_transfer_entropy_circular_shift_test.json"
      - "docs/source_contract_reviews/get_mathematical_contract.json"
      - "docs/source_contract_reviews/plot_transfer_entropy_sensitivity.json"
      - ".github/workflows/native-five-nonlinear-te-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 485/508 scoped inventory and seven SHA256 evidence receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              newline="",encoding="utf-8") as f:
              gaps=list(csv.reader(f,strict=True))
          assert len(gaps)==204,len(gaps)
          assert all(len(r)==7 for r in gaps)
          assert len({r[0] for r in gaps[1:]})==203
          assert all(r[-1] in ("TRUE","FALSE") for r in gaps[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              newline="",encoding="utf-8") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              newline="",encoding="utf-8") as f:
              non=list(csv.DictReader(f))
          assert len(registry)>=175,len(registry)
          assert len({r["python_name"] for r in registry})==len(registry)
          new=(
              "plot_kantz_sensitivity",
              "plot_lyapunov_sensitivity",
              "plot_windowed_rqa_sensitivity",
              "plot_transfer_entropy_circular_shift_test",
              "plot_conditional_transfer_entropy_circular_shift_test")
          inherited=(
              "get_mathematical_contract",
              "plot_transfer_entropy_sensitivity")
          for name in new:
              (gap,)=tuple(r for r in gaps[1:] if r[0]==name)
              assert gap[-1]=="FALSE",name
          for name in new+inherited:
              (row,)=tuple(r for r in registry if r["python_name"]==name)
              assert row["independently_certified"]=="FALSE",name
              raw=(root/row["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row["review_record_sha256"],name
              record=json.loads(raw)
              assert record["independently_certified"] is False
              assert record["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {ev["kind"] for ev in record["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"},name
              for ev in (record["native_files"]+record["case_evidence"]+
                         record.get("additional_regression_evidence",[])):
                  p=root/ev["path"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==ev["sha256"],p
          callable=sum(r[-1]=="TRUE" for r in gaps[1:])
          noncallable=sum(r["unresolved"]=="TRUE" for r in non)
          assert callable<=22,callable
          assert noncallable<=1,noncallable
          assert 508-callable-noncallable>=485
          print("485+/508 scoped and developer-reviewed; callable gaps <=22, noncallable <=1; no independently certified full Python contracts")
          PY
  native-r-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native Kantz Lyapunov RQA and TE source artist tests and legacy regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-five-nonlinear-te-sensitivity-artists-20261112|native-math-contracts-diagnostics|native-transfer-entropy-visual|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Differential scientific Matplotlib line, reference, legend and source NumPy histogram tests
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          np<-reticulate::import("numpy")
          stopifnot(identical(as.character(np$__version__),"2.3.5"))
          testthat::test_local(".",
            filter="native-five-nonlinear-te-sensitivity-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
