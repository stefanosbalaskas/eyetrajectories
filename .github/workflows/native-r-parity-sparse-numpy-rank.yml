name: Native sparse PACE NumPy rank and source error parity

on:
  pull_request:
    paths:
      - "R/native-sparse-source-pace-core.R"
      - "R/native-sparse-mfpca-source-core.R"
      - "R/native-sparse-mfpca-source.R"
      - "tests/testthat/test-native-sparse-numpy-rank-boundary.R"
      - "tests/testthat/test-native-sparse-pair-source-order.R"
      - "tests/testthat/test-native-sparse-planar-raw-covariance-audit.R"
      - "tests/testthat/test-native-planar-covariance-order-source.R"
      - "tests/testthat/test-native-sparse-source-pace.R"
      - "tests/testthat/test-native-sparse-mfpca-source.R"
      - ".github/workflows/native-r-parity-sparse-numpy-rank.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r:
    name: Sparse SVD rank native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Verify sparse native rank and structured error contracts
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".", quiet=TRUE)
          before <- reticulate::py_available(initialize=FALSE)
          testthat::test_local(".", filter="native-(planar-covariance-order-source|sparse-(numpy-rank-boundary|pair-source-order|planar-raw-covariance-audit|source-pace|mfpca-source))",
            reporter="summary", stop_on_failure=TRUE, stop_on_warning=TRUE)
          stopifnot(identical(before, reticulate::py_available(initialize=FALSE)))
          RSCRIPT

  frozen-python:
    name: Sparse SVD rank frozen Python 1.2 / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen Python 1.2 source
        run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Execute R/Python rank and error boundary comparison
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".", quiet=TRUE)
          stopifnot(identical(et_python_version(), "1.2.0"))
          testthat::test_local(".", filter="native-(planar-covariance-order-source|sparse-(numpy-rank-boundary|pair-source-order|planar-raw-covariance-audit|source-pace|mfpca-source))",
            reporter="summary", stop_on_failure=TRUE, stop_on_warning=TRUE)
          RSCRIPT
