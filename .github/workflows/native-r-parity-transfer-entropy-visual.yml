name: Native R transfer entropy source visual diagnostics
on:
  pull_request:
    paths:
      - "R/native-transfer-entropy-visual.R"
      - "R/native-full-parity-ledger.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "tests/testthat/test-native-transfer-entropy-visual.R"
      - "NAMESPACE"
      - ".github/workflows/native-r-parity-transfer-entropy-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: TE native R source geometries / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Parse the new source and its tests before package load
        shell: bash
        run: |
          Rscript -e 'parse(file="R/native-transfer-entropy-visual.R"); parse(file="tests/testthat/test-native-transfer-entropy-visual.R")'
      - name: Native R TE geometry and strict 508-source certification gate
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); before<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-transfer-entropy-visual|native-source-contract-gaps|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))'
  pinned-python:
    name: real published Python 1.2 TE Axes numerical source oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Published Python TE result classes and Matplotlib source geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-transfer-entropy-visual",reporter="summary",stop_on_failure=TRUE)'
