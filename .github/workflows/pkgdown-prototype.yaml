name: pkgdown scientific website prototype

# Preview build only; no GitHub Pages publishing.
on:
  pull_request:
    paths:
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'SITE_*.md'
      - 'scripts/build_pkgdown_gallery.R'
      - 'scripts/run_native_ggplot_gallery.R'
      - 'scripts/run_native_worked_gallery.R'
      - '.github/workflows/pkgdown-prototype.yaml'
      - '.Rbuildignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build scientific site preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOT_CRAN: 'true'
      ET_RUN_PYTHON_TESTS: 'false'
      RETICULATE_USE_MANAGED_VENV: 'no'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::pkgload, any::ggplot2
          needs: check
      - name: Generate synthetic native R figures
        shell: Rscript {0}
        run: source("scripts/build_pkgdown_gallery.R")
      - name: Build pkgdown in isolated site directory
        shell: Rscript {0}
        run: |
          pkgdown::build_site(
            pkg = ".", examples = FALSE, devel = TRUE,
            new_process = FALSE, install = FALSE, preview = FALSE
          )
          pngs <- paste0(c(
            "01_multilevel_variance", "02_participant_mean_band",
            "03_group_contrast_band", "04_sparse_support",
            "05_transfer_entropy_surrogates"), ".png")
          expected <- c("site/index.html", "site/reference/index.html",
                        "site/SITE_START.html", "site/SITE_VALIDATION.html",
                        "site/SITE_GALLERY.html", file.path("site/gallery", pngs))
          stopifnot(all(file.exists(expected)))
          message("SCIENTIFIC_PKGDOWN_SITE_PASS: five figures and required pages.")
      - name: Upload non-public preview
        uses: actions/upload-artifact@v4
        with:
          name: eyetrajectories-pkgdown-preview
          path: site/
          if-no-files-found: error
          retention-days: 7
