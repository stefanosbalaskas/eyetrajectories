name: Native wild projection and truncation scan frozen Python source
on:
  pull_request:
    paths:
      - "R/native-wild-bootstrap-projection.R"
      - "R/native-wild-bootstrap-truncation-scan.R"
      - "tests/testthat/test-native-wild-paired-full-source-20261111.R"
      - "tests/testthat/test-native-wild-bootstrap-projection.R"
      - "tests/testthat/test-native-wild-bootstrap-truncation-scan.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/wild_bootstrap_fpca_projection.json"
      - "docs/source_contract_reviews/scan_wild_bootstrap_fpca_truncations.json"
      - ".github/workflows/native-wild-projection-truncation-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen six-domain source receipts and 402/508 ledger
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path('.')
          gaps=list(csv.DictReader((root/'inst/extdata/native_source_contract_gaps_stage22.csv').open(encoding='utf-8',newline='')))
          nonfunctions=list(csv.DictReader((root/'inst/extdata/native_nonfunction_source_gaps_v1.csv').open(encoding='utf-8',newline='')))
          receipts=list(csv.DictReader((root/'inst/extdata/reviewed_source_contract_closures_v1.csv').open(encoding='utf-8',newline='')))
          assert len(gaps)==203 and len(nonfunctions)==1
          callable_missing=sum(x['unresolved_source_gap']=='TRUE' for x in gaps)
          noncallable_missing=sum(x['unresolved']=='TRUE' for x in nonfunctions)
          assert callable_missing<=105 and noncallable_missing==1,(callable_missing,noncallable_missing)
          assert 508-callable_missing-noncallable_missing>=402
          for name in ('wild_bootstrap_fpca_projection',
                       'scan_wild_bootstrap_fpca_truncations'):
              row,=[x for x in gaps if x['python_name']==name]
              assert row['unresolved_source_gap']=='FALSE'
              receipt,=[x for x in receipts if x['python_name']==name]
              assert receipt['independently_certified']=='FALSE'
              raw=(root/receipt['review_record_path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt['review_record_sha256']
              review=json.loads(raw)
              assert review['python_name']==name
              assert review['independently_certified'] is False
              assert review['frozen_python_commit']=='c1cd95ad718327550f7e55393ff38582872f7a94'
              assert {e['kind'] for e in review['case_evidence']}=={
                'source_signature','accepted_input_domain','numerical_outputs',
                'exception_semantics','returned_schema','scientific_estimand'}
              for evidence in review['native_files']+review['case_evidence']:
                  p=root/evidence['path']
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==evidence['sha256'],p
          print(f'{508-callable_missing-noncallable_missing}/508 provisional author-reviewed;'
                f' callable gaps={callable_missing}, noncallable={noncallable_missing};'
                ' no independent certifications')
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native scientific source contracts and prior numeric regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-wild-paired-full-source-20261111|native-wild-bootstrap-projection|native-wild-bootstrap-truncation-scan",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Typed frozen Python projection and shared truncation scan oracles
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-wild-paired-full-source-20261111|native-wild-bootstrap-projection|native-wild-bootstrap-truncation-scan",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
