name: Build and publish eyetrajectories 0.4.2 website

# Builds docs from the immutable v0.4.2 tag, overlays separate site sources,
# and publishes rendered static files to gh-pages. CRAN source is untouched.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pkgdown-website.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eyetrajectories-pkgdown-publication
  cancel-in-progress: false

jobs:
  publish-website:
    name: Build pkgdown and publish gh-pages branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOT_CRAN: 'true'
      ET_RUN_PYTHON_TESTS: 'false'
      MPLBACKEND: Agg
    steps:
      - name: Checkout qualified stable package source
        uses: actions/checkout@v4
        with:
          ref: v0.4.2
          path: pkg
          persist-credentials: false
      - name: Checkout isolated scientific website source
        uses: actions/checkout@v4
        with:
          ref: feat/pkgdown-scientific-site-20261116
          path: website
          persist-credentials: false
      - name: Overlay site files without changing release source
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'Version: 0.4.2' pkg/DESCRIPTION
          cp website/_pkgdown.yml pkg/
          cp website/SITE_*.md pkg/
          mkdir -p pkg/pkgdown pkg/scripts pkg/man/figures
          echo 'ed3c8bc9a99f73aa2f21d992edb4c3d245702a5efafddc7aeda230aa6892e05c  website/branding/eyetrajectories-logo-240.png' | sha256sum -c -
          cp website/branding/eyetrajectories-logo-240.png pkg/man/figures/logo.png
          cp -a website/pkgdown/. pkg/pkgdown/
          cp website/scripts/build_pkgdown_gallery.R pkg/scripts/
          test -s pkg/pkgdown/index.md
          test -s pkg/pkgdown/extra.css
          test -s pkg/SITE_VALIDATION.md
          test -s website/site-interactive/trajectory-explorer.html
          test -s website/site-interactive/methods-laboratory.html
          test -s website/scripts/test_methods_laboratory.cjs
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pkg
          extra-packages: any::pkgdown, any::pkgload, any::ggplot2
          needs: check
      - name: Generate reproducible synthetic R figure gallery
        shell: Rscript {0}
        working-directory: pkg
        run: source('scripts/build_pkgdown_gallery.R')
      - name: Build complete scientific site and verify routes
        shell: Rscript {0}
        working-directory: pkg
        run: |
          pkgdown::build_site(pkg='.', examples=FALSE, devel=TRUE,
                              new_process=FALSE, install=FALSE, preview=FALSE)
          stopifnot(file.copy('../website/site-interactive/trajectory-explorer.html',
                              'site/trajectory-explorer.html', overwrite=TRUE))
          stopifnot(file.copy('../website/site-interactive/methods-laboratory.html',
                              'site/methods-laboratory.html', overwrite=TRUE))
          dir.create('site/branding', recursive=TRUE, showWarnings=FALSE)
          assets <- list.files('../website/branding', full.names=TRUE,
                               pattern='\\.(png|svg)
          home <- paste(readLines('site/index.html', warn=FALSE), collapse='\n')
          stopifnot(grepl('class="et-hero-content"', home, fixed=TRUE))
          stopifnot(grepl('src="branding/eyetrajectories-logo-240.png"', home, fixed=TRUE))
          stopifnot(grepl('src="trajectory-explorer.html"', home, fixed=TRUE))
          stopifnot(!grepl('class="sourceCode"', home, fixed=TRUE))
          stopifnot(grepl('class="et-interactive-showcase"', home, fixed=TRUE))
          stopifnot(grepl('class="et-advanced-grid"', home, fixed=TRUE))
          stopifnot(grepl('href="methods-laboratory.html"', home, fixed=TRUE))
          stopifnot(grepl('href="SITE_INTERACTIVE.html"', home, fixed=TRUE))
          stopifnot(file.exists('site/reference/etr_fit_fpca.html'),
                    file.exists('site/reference/etr_dtw.html'),
                    file.exists('site/reference/etr_rqa_metrics.html'))
          gallery <- paste(readLines('site/SITE_GALLERY.html', warn=FALSE), collapse='\n')
          stopifnot(sum(gregexpr('<figure class="et-figure', gallery,
                                 fixed=TRUE)[[1L]] > 0L) >= 5L)
          required <- c(
            'site/index.html', 'site/reference/index.html',
            'site/SITE_START.html', 'site/SITE_METHODS.html',
            'site/SITE_BRIDGE.html', 'site/SITE_VALIDATION.html',
            'site/SITE_GALLERY.html', 'site/SITE_INTERACTIVE.html',
            'site/SITE_BRANDING.html',
            'site/branding/eyetrajectories-logo-240.png',
            'site/branding/eyetrajectories-symbol.svg',
            'site/branding/eyetrajectories-horizontal.svg',
            'site/favicon.svg',
            'site/trajectory-explorer.html', 'site/methods-laboratory.html',
            paste0('site/gallery/', c('01_multilevel_variance',
              '02_participant_mean_band', '03_group_contrast_band',
              '04_sparse_support', '05_transfer_entropy_surrogates'), '.png'))
          stopifnot(all(file.exists(required)))
          for (p in required) stopifnot(file.info(p)$size > 100)
          message('EYETRAJECTORIES_042_WEBSITE_BUILD_PASS')
      - name: Verify interactive trajectory JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          page=pathlib.Path('pkg/site/trajectory-explorer.html').read_text(encoding='utf-8')
          match=re.search(r'<script>([\s\S]*?)</script>', page)
          assert match, 'Missing interactive trajectory script'
          pathlib.Path('/tmp/eyetrajectories-lab.js').write_text(match.group(1), encoding='utf-8')
          assert 'requestAnimationFrame' in match.group(1)
          assert 'URL.createObjectURL' in match.group(1)
          PY
          node --check /tmp/eyetrajectories-lab.js
          node website/scripts/test_methods_laboratory.cjs pkg/site/methods-laboratory.html
      - name: Install independent SVG website favicon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          root = Path('pkg/site')
          href = '/eyetrajectories/branding/eyetrajectories-symbol.svg'
          tag = '<link rel="icon" type="image/svg+xml" href="' + escape(href) + '">'
          pages = list(root.rglob('*.html'))
          assert len(pages) > 10, 'Expected generated pkgdown documentation pages'
          for page in pages:
              content = page.read_text(encoding='utf-8')
              assert '</head>' in content, str(page)
              if tag not in content:
                  page.write_text(content.replace('</head>', tag + '\n</head>', 1), encoding='utf-8')
          assert (root / 'branding/eyetrajectories-logo-240.png').is_file()
          assert (root / 'branding/eyetrajectories-symbol.svg').is_file()
          print('BRANDING_ROUTES_PASS', len(pages), 'HTML pages')
          PY
      - name: Upload website build evidence
        uses: actions/upload-artifact@v4
        with:
          name: eyetrajectories-0.4.2-website
          path: pkg/site/
          if-no-files-found: error
          retention-days: 14
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pkg/site
          force_orphan: true
          enable_jekyll: false
          commit_message: 'docs(site): publish qualified v0.4.2 pkgdown website'
)
          stopifnot(length(assets) >= 4L)
          stopifnot(all(file.copy(assets, 'site/branding/', overwrite=TRUE)))
          stopifnot(file.copy('../website/branding/eyetrajectories-symbol.svg',
                              'site/favicon.svg', overwrite=TRUE))
          home <- paste(readLines('site/index.html', warn=FALSE), collapse='\n')
          stopifnot(grepl('class="et-hero-content"', home, fixed=TRUE))
          stopifnot(grepl('src="trajectory-explorer.html"', home, fixed=TRUE))
          stopifnot(!grepl('class="sourceCode"', home, fixed=TRUE))
          stopifnot(grepl('class="et-interactive-showcase"', home, fixed=TRUE))
          stopifnot(grepl('class="et-advanced-grid"', home, fixed=TRUE))
          stopifnot(grepl('href="methods-laboratory.html"', home, fixed=TRUE))
          stopifnot(grepl('href="SITE_INTERACTIVE.html"', home, fixed=TRUE))
          stopifnot(file.exists('site/reference/etr_fit_fpca.html'),
                    file.exists('site/reference/etr_dtw.html'),
                    file.exists('site/reference/etr_rqa_metrics.html'))
          gallery <- paste(readLines('site/SITE_GALLERY.html', warn=FALSE), collapse='\n')
          stopifnot(sum(gregexpr('<figure class="et-figure', gallery,
                                 fixed=TRUE)[[1L]] > 0L) >= 5L)
          required <- c(
            'site/index.html', 'site/reference/index.html',
            'site/SITE_START.html', 'site/SITE_METHODS.html',
            'site/SITE_BRIDGE.html', 'site/SITE_VALIDATION.html',
            'site/SITE_GALLERY.html', 'site/SITE_INTERACTIVE.html',
            'site/trajectory-explorer.html', 'site/methods-laboratory.html',
            paste0('site/gallery/', c('01_multilevel_variance',
              '02_participant_mean_band', '03_group_contrast_band',
              '04_sparse_support', '05_transfer_entropy_surrogates'), '.png'))
          stopifnot(all(file.exists(required)))
          for (p in required) stopifnot(file.info(p)$size > 100)
          message('EYETRAJECTORIES_042_WEBSITE_BUILD_PASS')
      - name: Verify interactive trajectory JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          page=pathlib.Path('pkg/site/trajectory-explorer.html').read_text(encoding='utf-8')
          match=re.search(r'<script>([\s\S]*?)</script>', page)
          assert match, 'Missing interactive trajectory script'
          pathlib.Path('/tmp/eyetrajectories-lab.js').write_text(match.group(1), encoding='utf-8')
          assert 'requestAnimationFrame' in match.group(1)
          assert 'URL.createObjectURL' in match.group(1)
          PY
          node --check /tmp/eyetrajectories-lab.js
          node website/scripts/test_methods_laboratory.cjs pkg/site/methods-laboratory.html
      - name: Upload website build evidence
        uses: actions/upload-artifact@v4
        with:
          name: eyetrajectories-0.4.2-website
          path: pkg/site/
          if-no-files-found: error
          retention-days: 14
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pkg/site
          force_orphan: true
          enable_jekyll: false
          commit_message: 'docs(site): publish qualified v0.4.2 pkgdown website'
