name: Native sparse async planar covariance source differential
on:
  pull_request:
    paths:
      - "R/native-sparse-mfpca-async-core.R"
      - "tests/testthat/test-native-sparse-async-covariance-source.R"
      - "tests/testthat/test-native-sparse-async-raw-pairs-source.R"
      - "tests/testthat/test-native-async-pace-curve-failure-source.R"
      - "tests/testthat/test-native-sparse-mfpca-async-source.R"
      - ".github/workflows/native-sparse-async-covariance-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Async planar covariance native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native joint asynchronous PACE regression and layout checks
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          start <- reticulate::py_available(initialize=FALSE)
          testthat::test_local(".", filter="native-(async-pace-curve-failure-source|sparse-(async-(covariance|raw-pairs)-source|mfpca-async-source))",
            reporter="summary", stop_on_failure=TRUE, stop_on_warning=TRUE)
          stopifnot(identical(start,reticulate::py_available(initialize=FALSE)))
          RSCRIPT
  frozen-python:
    name: Async covariance frozen Python 1.2 source / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned published Python 1.2 oracle
        run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Differential test of asynchronous covariance and PACE
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".", filter="native-(async-pace-curve-failure-source|sparse-(async-(covariance|raw-pairs)-source|mfpca-async-source))",
            reporter="summary", stop_on_failure=TRUE, stop_on_warning=TRUE)
          RSCRIPT
