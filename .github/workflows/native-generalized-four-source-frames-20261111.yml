name: Native generalized FoSR four observation frames frozen Python 1.2
on:
  pull_request:
    paths:
      - "R/native-scientific-source-frames.R"
      - "tests/testthat/test-native-generalized-four-source-frames-20261111.R"
      - "tests/testthat/test-native-scientific-source-frames.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - ".github/workflows/native-generalized-four-source-frames-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Four generalized FoSR frames native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Test four native scientific source frame records
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-generalized-four-source-frames-20261111",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          testthat::test_local(".",filter="native-scientific-source-frames",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - name: Verify recorded source contracts and reviewer receipt hashes
        if: runner.os == 'Linux'
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: Four generalized frames typed frozen Python 1.2 / ubuntu
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5" "pandas"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: 23 direct typed Python scientific frame comparisons
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-generalized-four-source-frames-20261111",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          testthat::test_local(".",filter="native-scientific-source-frames",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: python scripts/source_gap_inventory.py
