name: R cross-platform CRAN-style matrix (manual)

# Private-repository runner admission unresolved; manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cran-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: windows-latest
            r: release
          - os: macos-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1
    name: R ${{ matrix.r }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
      MPLBACKEND: Agg
      NOT_CRAN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: CRAN-style offline package check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: never
