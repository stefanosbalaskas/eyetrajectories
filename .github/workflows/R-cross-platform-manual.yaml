name: R cross-platform CRAN-style matrix (manual)

# Private-repository runner admission unresolved; manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cran-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: windows-latest
            r: release
          - os: macos-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1
    name: R ${{ matrix.r }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
      MPLBACKEND: Agg
      NOT_CRAN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      # The compact TinyTeX-1 bundle omitted pcrr8t.tfm on Windows.
      # Use the community-enhanced prebuilt bundle (GitHub Releases),
      # avoiding TeX package downloads when Courier is already included.
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: ${{ runner.os == 'Windows' && 'TinyTeX' || 'TinyTeX-1' }}
      - name: Verify Windows Courier font for full PDF manual
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 7
        run: |
          $ErrorActionPreference = 'Stop'
          $kpsewhich = (Get-Command kpsewhich -ErrorAction Stop).Source
          $font = & $kpsewhich pcrr8t.tfm
          if (-not $font) {
            # The previous default CDN hung during the 470-KB Courier fetch.
            # This independently indexed, up-to-date CTAN mirror is explicit.
            $mirror = 'https://mirrors.ibiblio.org/pub/mirrors/CTAN/systems/texlive/tlnet'
            $tlmgr = (Get-Command tlmgr -ErrorAction Stop).Source
            Write-Host "Courier absent from bundle. Installing from: $mirror"
            & $tlmgr --repository $mirror install courier
            if ($LASTEXITCODE -ne 0) { throw "Courier installation failed: $LASTEXITCODE" }
            $font = & $kpsewhich pcrr8t.tfm
          }
          if (-not $font) { throw "Courier font metric pcrr8t.tfm is missing" }
          Write-Host "Courier found: $font"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: CRAN-style offline package check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          # The action evaluates this input as R code: quote the R string.
          # Reject errors and warnings; retain NOTES for inspection.
          error-on: '"warning"'
