name: R cross-platform CRAN-style matrix (manual)

# Private-repository runner admission unresolved; manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cran-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: windows-latest
            r: release
          - os: macos-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1
    name: R ${{ matrix.r }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
      MPLBACKEND: Agg
      NOT_CRAN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      # Windows TinyTeX lacked pcrr8t.tfm (Courier): verify the actual
      # PDF-manual prerequisite instead of suppressing --as-cran.
      - name: Install Windows Courier font for PDF manual
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tlmgr install courier
          kpsewhich pcrr8t.tfm | grep -F 'pcrr8t.tfm'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: CRAN-style offline package check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          # The action evaluates this input as R code: quote the R string.
          # Reject errors and warnings; retain NOTES for inspection.
          error-on: '"warning"'
