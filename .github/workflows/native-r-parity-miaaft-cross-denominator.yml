name: Native MIAAFT cross-spectral denominator scientific audit

on:
  pull_request:
    paths:
      - "R/native-multivariate-iaaft-generator.R"
      - "tests/testthat/test-native-miaaft-cross-denominator-audit.R"
      - "scripts/trace_miaaft_source_witness.R"
      - "scripts/run_accelerated_scientific_wave.R"
      - ".github/workflows/native-r-parity-miaaft-cross-denominator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native MIAAFT spectral audit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: MIAAFT denominator audit and existing native surrogate regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          old <- reticulate::py_available(initialize=FALSE)
          testthat::test_local(".",
            filter="native-(miaaft-cross-denominator-audit|miaaft-fixed-permutation-source|multivariate-iaaft-generator)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          stopifnot(identical(old,reticulate::py_available(initialize=FALSE)))
          RSCRIPT

  python-oracle:
    name: Frozen Python 1.2 MIAAFT spectral error law / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare source-normalized stable cross-spectrum error
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-(miaaft-cross-denominator-audit|miaaft-fixed-permutation-source|multivariate-iaaft-generator)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
