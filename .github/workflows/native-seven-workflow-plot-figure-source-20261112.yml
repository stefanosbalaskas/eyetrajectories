name: Native W4 seven-route workflow plotting and figure export
on:
  pull_request:
    paths:
      - "R/native-workflow-plot-dispatch.R"
      - "tests/testthat/test-native-workflow-seven-plot-source-20261112.R"
      - "man/etr_native_release_workflow_exports.Rd"
      - "docs/source_contract_reviews/plot_workflow_result.json"
      - "docs/source_contract_reviews/save_workflow_figure.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-seven-workflow-plot-figure-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-record-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provisional 499 of 508 and both six-domain SHA256 source records
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="") as f:
              gaps=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="") as f:
              nc=list(csv.DictReader(f))
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="") as f:
              reviews=list(csv.DictReader(f))
          assert len(gaps)==203,len(gaps)
          assert len(reviews)>=189,len(reviews)
          assert len({x["python_name"] for x in reviews})==len(reviews)
          callable=sum(x["unresolved_source_gap"]=="TRUE" for x in gaps)
          noncallable=sum(x["unresolved"]=="TRUE" for x in nc)
          assert callable<=8,(callable,gaps)
          assert noncallable<=1,noncallable
          assert 508-callable-noncallable>=499
          for name in ("plot_workflow_result","save_workflow_figure"):
              (row,)=tuple(x for x in reviews if x["python_name"]==name)
              (gap,)=tuple(x for x in gaps if x["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE",name
              assert row["independently_certified"]=="FALSE"
              data=(root/row["review_record_path"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==row["review_record_sha256"],name
              j=json.loads(data)
              assert j["independently_certified"] is False
              assert j["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {r["kind"] for r in j["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for e in j["native_files"]+j["case_evidence"]+j.get("additional_regression_evidence",[]):
                  path=root/e["path"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==e["sha256"],path
          print("499/508 developer-scoped W4 source geometry; 8 callable and 1 noncallable gap; 0 independent certifications")
          PY
  native-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Execute source seven-route graphics and legacy workflow regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-workflow-seven-plot-source-20261112|native-workflow-plot-dispatch|native-sparse-scientific-graphics",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Frozen source list and strict native W4 tests
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          np<-reticulate::import("numpy")
          stopifnot(identical(as.character(np$__version__),"2.3.5"))
          testthat::test_local(".",filter="native-workflow-seven-plot-source-20261112",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
