name: Native sparse MFPCA four scientific artist contracts
on:
  pull_request:
    paths:
      - "R/native-sparse-scientific-graphics.R"
      - "R/native-sparse-mfpca-artist-source.R"
      - "tests/testthat/test-native-sparse-mfpca-four-artist-source-20261112.R"
      - "tests/testthat/test-native-sparse-scientific-graphics.R"
      - "docs/source_contract_reviews/plot_sparse_mfpca_component.json"
      - "docs/source_contract_reviews/plot_sparse_mfpca_covariance_blocks.json"
      - "docs/source_contract_reviews/plot_sparse_mfpca_cross_covariance.json"
      - "docs/source_contract_reviews/plot_sparse_mfpca_score_diagnostics.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-sparse-mfpca-four-artist-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-scientific artist review receipts and 508-export ledger
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def records(p):
              with (root/p).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          gap=records("inst/extdata/native_source_contract_gaps_stage22.csv")
          other=records("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reg=records("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gap)==203 and len(other)==1
          remaining=sum(x["unresolved_source_gap"]=="TRUE" for x in gap)
          remaining_other=sum(x["unresolved"]=="TRUE" for x in other)
          reviewed=508-remaining-remaining_other
          assert reviewed>=432 and remaining<=75 and remaining_other<=1
          names=(
            "plot_sparse_mfpca_component",
            "plot_sparse_mfpca_covariance_blocks",
            "plot_sparse_mfpca_cross_covariance",
            "plot_sparse_mfpca_score_diagnostics")
          for name in names:
              (target,)=tuple(x for x in gap if x["python_name"]==name)
              assert target["unresolved_source_gap"]=="FALSE"
              (receipt,)=tuple(x for x in reg if x["python_name"]==name)
              assert receipt["independently_certified"]=="FALSE"
              raw=(root/receipt["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt["review_record_sha256"]
              record=json.loads(raw)
              assert record["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert record["independently_certified"] is False
              assert {x["kind"] for x in record["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for ev in record["native_files"]+record["case_evidence"]:
                  source=root/ev["path"]
                  assert hashlib.sha256(source.read_bytes()).hexdigest()==ev["sha256"],source
          print(f"{reviewed}/508 provisional source scientific reviews; "
                f"{remaining} callable gaps and {remaining_other} noncallable gaps; "
                "zero new independent certifications")
          PY
  native-three-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Test actual native sparse PACE fit and four source-comparable graphics
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-sparse-mfpca-four-artist-source-20261112|native-sparse-scientific-graphics",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare exact Python 1.2 Matplotlib artist arrays and limits against native R
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-sparse-mfpca-four-artist-source-20261112|native-sparse-scientific-graphics",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
