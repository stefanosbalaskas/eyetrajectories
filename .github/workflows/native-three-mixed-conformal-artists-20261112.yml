name: Native three mixed and direct conformal scientific source artists
on:
  pull_request:
    paths:
      - "R/native-three-mixed-conformal-artists.R"
      - "R/native-mixed-random-effects-plots.R"
      - "R/native-functional-inference-visuals.R"
      - "tests/testthat/test-native-three-mixed-conformal-scientific-artists-20261112.R"
      - "tests/testthat/test-native-mixed-random-effects-plots.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_functional_random_effects.json"
      - "docs/source_contract_reviews/plot_functional_trial_random_effects.json"
      - "docs/source_contract_reviews/plot_conformal_fpca_anomaly.json"
      - ".github/workflows/native-three-mixed-conformal-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 496/508 scoped ledger and eight six-domain scientific SHA256 reviews
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              encoding="utf-8",newline="") as f:
              gaps=list(csv.reader(f,strict=True))
          assert len(gaps)==204,len(gaps)
          assert all(len(x)==7 for x in gaps)
          assert len({x[0] for x in gaps[1:]})==203
          assert all(x[-1] in ("TRUE","FALSE") for x in gaps[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              encoding="utf-8",newline="") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              encoding="utf-8",newline="") as f:
              non=list(csv.DictReader(f))
          assert len(registry)>=186,len(registry)
          assert len({r["python_name"] for r in registry})==len(registry)
          fresh=("plot_functional_random_effects",
              "plot_functional_trial_random_effects",
              "plot_conformal_fpca_anomaly")
          inherited=("function_on_scalar_reporting_text",
              "conformal_fpca_anomaly_reporting_text",
              "plot_functional_variance_decomposition",
              "plot_function_on_scalar_coefficients",
              "plot_rqa_metric_mean_bootstrap")
          for name in fresh:
              (item,)=tuple(x for x in gaps[1:] if x[0]==name)
              assert item[-1]=="FALSE",name
          for name in fresh+inherited:
              (row,)=tuple(r for r in registry if r["python_name"]==name)
              assert row["independently_certified"]=="FALSE",name
              raw=(root/row["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row["review_record_sha256"],name
              data=json.loads(raw)
              assert data["independently_certified"] is False
              assert data["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in data["case_evidence"]}=={
                  "source_signature","accepted_input_domain",
                  "numerical_outputs","exception_semantics",
                  "returned_schema","scientific_estimand"},name
              for e in (data["native_files"]+data["case_evidence"]+
                        data.get("additional_regression_evidence",[])):
                  path=root/e["path"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==e["sha256"],path
          callable_gaps=sum(r[-1]=="TRUE" for r in gaps[1:])
          noncallable_gaps=sum(r["unresolved"]=="TRUE" for r in non)
          assert callable_gaps<=11,callable_gaps
          assert noncallable_gaps<=1,noncallable_gaps
          assert 508-callable_gaps-noncallable_gaps>=496
          print("496/508 provisional scoped scientific geometry; <=11 callable plus <=1 noncallable; independent certification 0")
          PY
  three-os-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native mixed/conformal new scientific artist and original regression suites
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-three-mixed-conformal-scientific-artists-20261112|native-mixed-random-effects-plots|native-functional-inference-visuals|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Direct pinned Python 1.2 public Matplotlib mixed BLUP and conformal source artist comparisons
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          np<-reticulate::import("numpy")
          stopifnot(identical(as.character(np$__version__),"2.3.5"))
          testthat::test_local(".",
            filter="native-three-mixed-conformal-scientific-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
