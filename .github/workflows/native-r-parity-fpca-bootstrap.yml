name: Native R published FPCA uncertainty source contracts
on:
  pull_request:
    paths:
      - "R/native-fpca-bootstrap-source.R"
      - "R/native-full-parity-ledger.R"
      - "tests/testthat/test-native-fpca-bootstrap-source.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "NAMESPACE"
      - ".github/workflows/native-r-parity-fpca-bootstrap.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: FPCA reporting and graphics geometry / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Source fixture reports, plotting geometry and certification blocks
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-fpca-bootstrap-source|native-source-contract-gaps|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))'
  published-python-1-2:
    name: four pinned published Python source text oracles
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Exact Python 1.2 manuscript report source text and R plot numeric geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-fpca-bootstrap-source",reporter="summary",stop_on_failure=TRUE)'
