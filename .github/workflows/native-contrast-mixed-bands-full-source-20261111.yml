name: Native generalized contrast and mixed full source bands
on:
  pull_request:
    paths:
      - "R/native-generalized-fosr-contrast-source.R"
      - "R/native-mixed-coefficient-bands-source.R"
      - "tests/testthat/test-native-contrast-mixed-bands-full-source-20261111.R"
      - "tests/testthat/test-native-generalized-fosr-contrast-source.R"
      - "tests/testthat/test-native-mixed-coefficient-bands-source.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/generalized_function_on_scalar_mean_difference_band.json"
      - "docs/source_contract_reviews/functional_mixed_effects_simultaneous_bands.json"
      - ".github/workflows/native-contrast-mixed-bands-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact scientific evidence SHA256 and live census
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          ledger=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          types=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          receipts=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          names=("generalized_function_on_scalar_mean_difference_band",
                 "functional_mixed_effects_simultaneous_bands")
          assert len(ledger)==203 and len(types)==1
          gaps=sum(r["unresolved_source_gap"]=="TRUE" for r in ledger)
          nongaps=sum(r["unresolved"]=="TRUE" for r in types)
          assert gaps<=116 and nongaps==1,(gaps,nongaps)
          assert 508-gaps-nongaps>=391
          for name in names:
              source,=[r for r in ledger if r["python_name"]==name]
              receipt,=[r for r in receipts if r["python_name"]==name]
              assert source["unresolved_source_gap"]=="FALSE"
              assert receipt["independently_certified"]=="FALSE"
              raw=(root/receipt["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt["review_record_sha256"]
              record=json.loads(raw)
              assert record["python_name"]==name
              assert record["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert record["independently_certified"] is False
              assert {e["kind"] for e in record["case_evidence"]}=={
                "source_signature","accepted_input_domain","numerical_outputs",
                "exception_semantics","returned_schema","scientific_estimand"}
              for e in record["native_files"]+record["case_evidence"]:
                  actual=hashlib.sha256((root/e["path"]).read_bytes()).hexdigest()
                  assert actual==e["sha256"],e["path"]
          print(f"Author-reviewed {508-gaps-nongaps}/508; remaining {gaps}+{nongaps}; independently certified=0")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native five-contrast and mixed-bootstrap source tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-contrast-mixed-bands-full-source-20261111|native-generalized-fosr-contrast-source|native-mixed-coefficient-bands-source",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Full typed frozen Python 1.2 generalized contrasts and mixed bands
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-contrast-mixed-bands-full-source-20261111|native-generalized-fosr-contrast-source|native-mixed-coefficient-bands-source",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
