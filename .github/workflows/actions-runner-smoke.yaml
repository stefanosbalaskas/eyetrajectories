name: Actions runner startup diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-runner-smoke.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-start:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub runner can execute a single command
        run: |
          echo "Runner admitted and shell executed"
          date -u
