name: Actions runner startup diagnostic


# TEMPORARY: manual-only until private-repository runner admission is fixed.
# See issue #3. Restore push and pull_request triggers after runner smoke passes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-start:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub runner can execute a single command
        run: |
          echo "Runner admitted and shell executed"
          date -u
