name: Native R audited Frechet and DTW parity

on:
  pull_request:
    paths:
      - "R/native-distance-contracts.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-native-distance-contracts.R"
      - "tests/testthat/test-native-distances-parity-ledger.R"
      - ".github/workflows/native-r-parity-stage4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r-no-python:
    name: Native on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Full native DTW/Frechet path tests and closed 508 gate
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was <- reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="(?:native-distance-contracts|native-distances-parity-ledger)|full-native-r-parity-ledger|native-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(reticulate::py_available(initialize=FALSE),was))'

  python-reference-oracle:
    name: Pinned Python 1.2 path and normalized-cost oracle / Linux
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Setup exact Python interpreter
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stable Python 1.2 oracle
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare R and Python costs, paths, step weights and pairwise matrices
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="(?:native-distance-contracts|native-distances-parity-ledger)",reporter="summary",stop_on_failure=TRUE)'
