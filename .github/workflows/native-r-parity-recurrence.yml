name: Native R recurrence and nonlinear dynamics

on:
  pull_request:
    paths:
      - "R/native-nonlinear-recurrence.R"
      - "R/native-recurrence.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-(?:native-nonlinear-recurrence|native-recurrence-parity-ledger)*.R"
      - ".github/workflows/native-r-parity-recurrence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-r:
    name: Native nonlinear R batch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Source R tests and full strict 508-source parity audit
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="(?:native-nonlinear-recurrence|native-recurrence-parity-ledger)|native-irregular-parity-ledger|native-portable-parity-ledger|native-trajectory-parity-ledger|native-distances-parity-ledger|native-parity-ledger|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))'

  python-1-2-reference:
    name: Nonlinear R versus Python 1.2 scientific oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Python scientific source
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native R recurrence against Python source contracts
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="(?:native-nonlinear-recurrence|native-recurrence-parity-ledger)",reporter="summary",stop_on_failure=TRUE)'
