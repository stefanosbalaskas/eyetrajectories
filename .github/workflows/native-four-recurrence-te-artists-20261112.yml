name: Native four recurrence RQA and transfer entropy scientific source artists
on:
  pull_request:
    paths:
      - "R/native-four-recurrence-te-scientific-artists.R"
      - "R/native-nine-scientific-plots.R"
      - "R/native-transfer-entropy-visual.R"
      - "tests/testthat/test-native-four-recurrence-te-scientific-artists-20261112.R"
      - "tests/testthat/test-native-nine-scientific-plots.R"
      - "tests/testthat/test-native-transfer-entropy-visual.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_joint_recurrence.json"
      - "docs/source_contract_reviews/plot_windowed_rqa_trajectories.json"
      - "docs/source_contract_reviews/plot_rqa_sensitivity.json"
      - "docs/source_contract_reviews/plot_transfer_entropy_sensitivity.json"
      - ".github/workflows/native-four-recurrence-te-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 480/508 source-scoped ledger and ten six-domain SHA256 receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              newline="",encoding="utf-8") as f:
              rows=list(csv.reader(f,strict=True))
          assert len(rows)==204,len(rows)
          assert len({r[0] for r in rows[1:]})==203
          assert all(len(r)==7 for r in rows)
          assert all(r[-1] in ("TRUE","FALSE") for r in rows[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              newline="",encoding="utf-8") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              newline="",encoding="utf-8") as f:
              non=list(csv.DictReader(f))
          assert len(registry)>=170,len(registry)
          assert len({r["python_name"] for r in registry})==len(registry)
          fresh=(
              "plot_joint_recurrence","plot_windowed_rqa_trajectories",
              "plot_rqa_sensitivity","plot_transfer_entropy_sensitivity")
          inherited=(
              "plot_fpca_stability","plot_fpca_influence",
              "plot_fpca_outlier_diagnostics",
              "plot_fpca_cross_validation",
              "plot_fpca_subspace_stability","plot_functional_mean_band")
          for name in fresh:
              (gap,)=tuple(r for r in rows[1:] if r[0]==name)
              assert gap[-1]=="FALSE",name
          for name in fresh+inherited:
              (entry,)=tuple(r for r in registry if r["python_name"]==name)
              assert entry["independently_certified"]=="FALSE",name
              data=(root/entry["review_record_path"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==entry["review_record_sha256"],name
              record=json.loads(data)
              assert record["independently_certified"] is False
              assert record["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {ev["kind"] for ev in record["case_evidence"]}=={
                  "source_signature","accepted_input_domain",
                  "numerical_outputs","exception_semantics",
                  "returned_schema","scientific_estimand"}
              for ev in record["native_files"]+record["case_evidence"]+record.get("additional_regression_evidence",[]):
                  file=root/ev["path"]
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==ev["sha256"],file
          callable_gaps=sum(r[-1]=="TRUE" for r in rows[1:])
          noncallable_gaps=sum(r["unresolved"]=="TRUE" for r in non)
          assert callable_gaps<=27,callable_gaps
          assert noncallable_gaps<=1,noncallable_gaps
          assert 508-callable_gaps-noncallable_gaps>=480
          print("480/508 provisional, <=27 callable + <=1 noncallable gaps; 0 independently certified")
          PY
  three-os-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Run new and inherited native recurrence and TE source plot tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-four-recurrence-te-scientific-artists-20261112|native-nine-scientific-plots|native-transfer-entropy-visual|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Compare frozen Python 1.2 public Matplotlib sparse/line artists with native R
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-four-recurrence-te-scientific-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
