name: Native trapezoid Python 1.2 full-contract review
on:
  pull_request:
    paths:
      - "R/native-fpca.R"
      - "tests/testthat/test-native-trapezoid-full-source-closure.R"
      - "tests/testthat/test-native-trapezoid-complex-source.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - "scripts/source_gap_inventory.py"
      - "tests/test_source_gap_inventory.py"
      - ".github/workflows/native-trapezoid-full-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Trapezoid source native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native source input/domain and numerical regression
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          start<-reticulate::py_available(initialize=FALSE)
          testthat::test_local(".",filter="native-trapezoid-(full-source-closure|complex-source)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          stopifnot(identical(start,reticulate::py_available(initialize=FALSE)))
          RSCRIPT
      - name: Validate source gap counts and hashed author review
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: Trapezoid frozen Python 1.2 / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare source casts, grids, flags, errors, numeric weights
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-trapezoid-(full-source-closure|complex-source)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
