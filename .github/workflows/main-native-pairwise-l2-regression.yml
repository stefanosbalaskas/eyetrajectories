name: Main native L2 regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'R/native-distances.R'
      - 'tests/testthat/test-native-pairwise-l2-fastpath.R'
      - '.github/workflows/main-native-pairwise-l2-regression.yml'
  push:
    branches: [main]
    paths:
      - 'R/native-distances.R'
      - 'tests/testthat/test-native-pairwise-l2-fastpath.R'
      - '.github/workflows/main-native-pairwise-l2-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-distance-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ET_RUN_PYTHON_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R test dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libuv1-dev libpng-dev libcurl4-openssl-dev libssl-dev
      - name: Install R tooling
        shell: Rscript {0}
        run: |
          install.packages(c('pkgload','testthat','reticulate'),
            repos=Sys.getenv('RSPM', 'https://cloud.r-project.org'))
      - name: Parse source and regression tests
        shell: Rscript {0}
        run: |
          parse(file='R/native-distances.R')
          parse(file='tests/testthat/test-native-pairwise-l2-fastpath.R')
          cat('MAIN_NATIVE_L2_SYNTAX_PASS\n')
      - name: Run native core and new distance regression tests
        shell: Rscript {0}
        run: |
          testthat::test_local('.', filter='native-(core|pairwise-l2-fastpath)',
            reporter='summary', stop_on_failure=TRUE)
          cat('MAIN_NATIVE_L2_REGRESSION_PASS\n')
