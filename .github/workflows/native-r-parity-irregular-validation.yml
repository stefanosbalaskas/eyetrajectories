name: Native R batch — irregular trajectories and validation

on:
  pull_request:
    paths:
      - "R/native-batch-irregular-validation.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-(?:native-batch-irregular-validation|native-irregular-parity-ledger)*.R"
      - ".github/workflows/native-r-parity-irregular-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-r:
    name: ten-function batch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native batch tests, all source inventory gates, no Python initialization
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="(?:native-batch-irregular-validation|native-irregular-parity-ledger)|native-portable-parity-ledger|native-trajectory-parity-ledger|native-distances-parity-ledger|native-parity-ledger|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))
          RSCRIPT

  python-reference:
    name: irregular-data Python 1.2 numerical reference
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned stable Python numerical source
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare multiple irregular curve time grids, linear projection and summaries
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="(?:native-batch-irregular-validation|native-irregular-parity-ledger)",reporter="summary",stop_on_failure=TRUE)'
