name: Native paired mixed covariance bandwidth source parity
on:
  pull_request:
    paths:
      - "R/native-mixed-sensitivity-paired-band-source.R"
      - "R/native-joint-likelihood-covariance-sensitivity.R"
      - "R/native-generalized-mixed-source-graphics.R"
      - "tests/testthat/test-native-paired-mixed-band-sensitivity-20261112.R"
      - "tests/testthat/test-native-generalized-mixed-source-graphics.R"
      - "docs/source_contract_reviews/plot_covariance_sensitivity_band_widths.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-paired-mixed-band-sensitivity-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-domain-pinned-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provisional 500/508 and fresh and inherited SHA256 proofs
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def rows(path):
              with (root/path).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          g=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          n=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          r=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(g)==203,len(g)
          assert len(r)>=190,len(r)
          assert len({v["python_name"] for v in r})==len(r)
          callable=sum(v["unresolved_source_gap"]=="TRUE" for v in g)
          noncallable=sum(v["unresolved"]=="TRUE" for v in n)
          assert callable<=7,callable
          assert noncallable<=1,noncallable
          assert 508-callable-noncallable>=500
          names=[
            "plot_covariance_sensitivity_band_widths",
            "plot_covariance_sensitivity_coefficients",
            "plot_functional_mixed_effects_residual_acf",
            "plot_functional_mixed_effects_residual_variogram",
            "plot_generalized_function_on_scalar_predictions",
            "plot_generalized_function_on_scalar_mean_difference",
            "plot_generalized_function_on_scalar_coefficients",
            "plot_functional_variance_decomposition",
          ]
          for name in names:
              (entry,)=tuple(v for v in r if v["python_name"]==name)
              (gap,)=tuple(v for v in g if v["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE",name
              assert entry["independently_certified"]=="FALSE"
              raw=(root/entry["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==entry["review_record_sha256"],name
              obj=json.loads(raw)
              assert obj["independently_certified"] is False
              assert obj["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {v["kind"] for v in obj["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"},name
              for v in obj["native_files"]+obj["case_evidence"]+obj.get("additional_regression_evidence",[]):
                  p=root/v["path"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==v["sha256"],p
          print("500/508 provisional native scientific source contracts; 7 callable + 1 noncallable open; no independent full contracts")
          PY
  native-r-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::nlme
      - name: Paired native band source, no-refit and prior graphics regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-paired-mixed-band-sensitivity-20261112|native-joint-likelihood-covariance-sensitivity|native-generalized-mixed-source-graphics|native-mixed-coefficient-bands-source",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  pinned-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::nlme
            any::reticulate
      - name: Python 1.2 width-oracle rows and Matplotlib line coordinates
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          stopifnot(identical(as.character(
            reticulate::import("numpy")$__version__),"2.3.5"))
          testthat::test_local(".",
            filter="native-paired-mixed-band-sensitivity-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
