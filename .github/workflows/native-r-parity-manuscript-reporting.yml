name: Native R reporting contracts and source text oracles
on:
  pull_request:
    paths:
      - "R/native-manuscript-reporting.R"
      - "R/native-inference-reporting.R"
      - "R/native-inference-reporting-extensions.R"
      - "man/etr_native_inference_reporting.Rd"
      - "R/native-functional-diagnostics.R"
      - "inst/extdata/native_contract_certification_pilots_v1.csv"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "tests/testthat/test-native-source-boundaries.R"
      - "R/native-full-parity-ledger.R"
      - "tests/testthat/test-native-manuscript-reporting.R"
      - "tests/testthat/test-native-inference-reporting.R"
      - "tests/testthat/test-native-inference-reporting-extensions.R"
      - "NAMESPACE"
      - ".github/workflows/native-r-parity-manuscript-reporting.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: native reporting and 508 ledger / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Parse inference source and oracle fixtures
        shell: bash
        run: |
          Rscript -e 'parse(file="R/native-inference-reporting.R"); parse(file="R/native-inference-reporting-extensions.R"); parse(file="tests/testthat/test-native-inference-reporting.R"); parse(file="tests/testthat/test-native-inference-reporting-extensions.R")'
      - name: Native text, source ledger, and reticulate isolation
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); before<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-inference-reporting|native-manuscript-reporting|native-source-contract-gaps|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))'
  pinned-python:
    name: direct published Python 1.2 reporting text oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Exact source text comparison on matched synthetic summary objects
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-inference-reporting|native-manuscript-reporting|native-source-boundaries|native-source-contract-gaps",reporter="summary",stop_on_failure=TRUE)'
