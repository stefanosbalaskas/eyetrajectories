name: Native R Cross-validation leakage-aware CV and uncertainty frames

on:
  pull_request:
    paths:
      - "R/native-cv-uncertainty.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-(?:native-cv-uncertainty)*.R"
      - "tests/testthat/test-native-stage*-parity-ledger.R"
      - ".github/workflows/native-r-parity-stage12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r:
    name: Cross-validation native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Cross-validation native numerical, grouped holdouts and ledger
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="(?:native-cv-uncertainty)|(?:native-nonlinear-reporting)|(?:native-fpca-extensions)|(?:native-functional-diagnostics)|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))'

  python-v1-2-cv:
    name: Cross-validation pinned Python 1.2 heldout CV numerical oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install published reference
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare heldout errors with independent Python reference
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-cv-uncertainty",reporter="summary",stop_on_failure=TRUE)'
