name: Native windowed RQA whole-source physical and target recurrence contracts

on:
  pull_request:
    paths:
      - "R/native-functional-rqa-recovery.R"
      - "tests/testthat/test-native-rqa-physical-target-whole-source.R"
      - ".github/workflows/native-r-parity-rqa-physical-target.yml"
      - "scripts/run_accelerated_scientific_wave.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native RQA sensitivity source domains / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Test complete RQA sensitivity and time-unit regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          before<-reticulate::py_available(initialize=FALSE)
          testthat::test_local(".",
            filter="native-(rqa-physical-target-whole-source|functional-rqa-recovery|source-windowed-rqa-time-units)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))
          RSCRIPT

  frozen-python:
    name: Frozen Python 1.2 RQA sensitivity source whole-return / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Direct published source comparison on two numerical policies
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-(rqa-physical-target-whole-source|functional-rqa-recovery|source-windowed-rqa-time-units)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
