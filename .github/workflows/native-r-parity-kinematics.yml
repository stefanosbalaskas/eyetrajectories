name: Native R to Python 1.2 numerical parity (stage 2)

on:
  pull_request:
    paths:
      - "R/native-planar-geometry-parity.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-native-planar-geometry-parity.R"
      - "tests/testthat/test-full-native-r-parity-ledger.R"
      - ".github/workflows/native-r-parity-kinematics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r-no-python:
    name: Pure R native geometry / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Check native analytic geometry and strict parity inventory
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); testthat::test_local(".",filter="native-planar-geometry-parity|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE)'
      - name: Require incomplete parity to fail closed
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(inherits(try(etr_native_parity_catalog(require_complete=TRUE),silent=TRUE),"try-error"))'

  python-reference-oracle:
    name: Independent Python reference / Linux py3.12
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin Python 1.2 numerical reference implementation
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Execute Python-independent native methods against stable Python oracle
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); testthat::test_local(".",filter="native-planar-geometry-parity",reporter="summary",stop_on_failure=TRUE)'
