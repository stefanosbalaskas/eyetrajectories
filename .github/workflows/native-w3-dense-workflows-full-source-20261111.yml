name: Native W3 FPCA and FOS full frozen Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-source-workflows.R"
      - "R/native-w3-dense-workflow-source-boundary.R"
      - "R/native-fpca.R"
      - "R/native-functional-regression.R"
      - "tests/testthat/test-native-w3-dense-workflows-full-source-20261111.R"
      - "tests/testthat/test-native-source-workflows.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/run_fpca_workflow.json"
      - "docs/source_contract_reviews/run_function_on_scalar_workflow.json"
      - ".github/workflows/native-w3-dense-workflows-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-domain-source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 409 of 508 provisional ledger and both SHA256 source evidence records
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          gaps=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          nc=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          receipts=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          assert len(gaps)==203 and len(nc)==1
          callable_left=sum(x["unresolved_source_gap"]=="TRUE" for x in gaps)
          noncallable_left=sum(x["unresolved"]=="TRUE" for x in nc)
          assert callable_left<=98 and noncallable_left==1,(callable_left,noncallable_left)
          assert 508-callable_left-noncallable_left>=409
          for name in ("run_fpca_workflow","run_function_on_scalar_workflow"):
            row,=(x for x in gaps if x["python_name"]==name)
            assert row["unresolved_source_gap"]=="FALSE",name
            receipt,=(x for x in receipts if x["python_name"]==name)
            assert receipt["independently_certified"]=="FALSE",name
            document=(root/receipt["review_record_path"]).read_bytes()
            assert hashlib.sha256(document).hexdigest()==receipt["review_record_sha256"],name
            review=json.loads(document)
            assert review["python_name"]==name
            assert review["independently_certified"] is False
            assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
            assert {x["kind"] for x in review["case_evidence"]}=={
              "source_signature","accepted_input_domain","numerical_outputs",
              "exception_semantics","returned_schema","scientific_estimand"}
            for entry in review["native_files"]+review["case_evidence"]:
              file=root/entry["path"]
              assert hashlib.sha256(file.read_bytes()).hexdigest()==entry["sha256"],file
          print(f"{508-callable_left-noncallable_left}/508 provisional "
                f"source-scientific closures; {callable_left} callable, "
                f"{noncallable_left} noncallable gap; "
                "independent certifications=0")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native FPCA and FOS W3 source-scientific tests and old numerical regression checks
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-w3-dense-workflows-full-source-20261111|native-source-workflows",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Typed frozen Python 1.2 FPCA, FOS, HC1, reporting and table oracles
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-w3-dense-workflows-full-source-20261111|native-source-workflows",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
