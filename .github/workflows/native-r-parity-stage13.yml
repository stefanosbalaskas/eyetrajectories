name: Native R Stage 13 functional OLS and nonlinear diagnostics

on:
  pull_request:
    paths:
      - "R/native-stage13-*.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-native-stage13*.R"
      - ".github/workflows/native-r-parity-stage13.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r:
    name: Stage 13 native scientific methods / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native OLS HC1 bootstrap FNN and cumulative source ledger
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-stage13-functional-models|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))'

  python-v1-2-fos-oracle:
    name: Stage 13 independent pinned Python 1.2 numerical OLS oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source reference
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare independent native functional regression numerics
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-stage13-functional-models",reporter="summary",stop_on_failure=TRUE)'
