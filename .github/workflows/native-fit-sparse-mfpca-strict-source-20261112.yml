name: Native strict sparse MFPCA source record Python 1.2
on:
  pull_request:
    paths:
      - "R/native-sparse-joint-score-workflows.R"
      - "R/native-sparse-mfpca-w2-result.R"
      - "tests/testthat/test-native-fit-sparse-mfpca-strict-source-20261112.R"
      - "docs/source_contract_reviews/fit_sparse_mfpca.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "man/etr_fit_sparse_mfpca.Rd"
      - ".github/workflows/native-fit-sparse-mfpca-strict-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-domain-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source record, SHA256 receipts and 508-export ledger
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def records(path):
              with (root/path).open(encoding="utf-8",newline="") as fh:
                  return list(csv.DictReader(fh))
          gaps=records("inst/extdata/native_source_contract_gaps_stage22.csv")
          nc=records("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reg=records("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gaps)==203 and len(nc)==1
          remaining=sum(row["unresolved_source_gap"]=="TRUE" for row in gaps)
          noncallable=sum(row["unresolved"]=="TRUE" for row in nc)
          assert remaining<=85 and noncallable<=1 and 508-remaining-noncallable>=422
          (gap,)=tuple(x for x in gaps if x["python_name"]=="fit_sparse_mfpca")
          assert gap["unresolved_source_gap"]=="FALSE"
          (r,)=tuple(x for x in reg if x["python_name"]=="fit_sparse_mfpca")
          assert r["independently_certified"]=="FALSE"
          raw=(root/r["review_record_path"]).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==r["review_record_sha256"]
          review=json.loads(raw)
          assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
          assert review["independently_certified"] is False
          assert {a["kind"] for a in review["case_evidence"]}=={
            "source_signature","accepted_input_domain","numerical_outputs",
            "exception_semantics","returned_schema","scientific_estimand"}
          for file in review["native_files"]+review["case_evidence"]:
              p=root/file["path"]
              assert hashlib.sha256(p.read_bytes()).hexdigest()==file["sha256"],p
          print("422/508 provisional native source reviews; 85 callable + 1 noncallable gaps; no independent certificates")
          PY
  native-three-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Strict source 29-field MFPCA and existing numerical regression
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-fit-sparse-mfpca-strict-source-20261112|native-sparse-mfpca-source",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare public native source result against Python 1.2 dataclass arrays and diagnostics
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-fit-sparse-mfpca-strict-source-20261112|native-sparse-mfpca-source",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
