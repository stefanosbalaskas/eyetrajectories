name: Phase 3 known-truth simulation qualification


# TEMPORARY: manual-only until private-repository runner admission is fixed.
# See issue #3. Restore push and pull_request triggers after runner smoke passes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-simulation:
    runs-on: ubuntu-latest
    env:
      ET_PHASE3_SMOKE: "true"
      ET_PHASE3_INCLUDE_PACE: "false"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: test
      - name: Test Phase 3 source and scientific input contracts
        run: Rscript -e 'testthat::test_local(".", filter = "phase3-expansion", reporter = "summary")'
      - name: Run independent synthetic audit
        run: Rscript scripts/run_phase3_validation.R artifacts/phase3
      - name: Preserve full simulation reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-simulations
          path: artifacts/phase3/
          if-no-files-found: warn
