name: Native R functional RQA and published recovery metadata
on:
  pull_request:
    paths:
      - "R/native-functional-rqa-recovery.R"
      - "R/native-full-parity-ledger.R"
      - "inst/extdata/native_recovery_metric_catalog_py120.csv"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "tests/testthat/test-native-functional-rqa-recovery.R"
      - "NAMESPACE"
      - ".github/workflows/native-r-parity-functional-rqa-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: multiscale RQA numerical and recovery inventory / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Deterministic RQA sensitivity and whole-function multiplier band
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); before<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-functional-rqa-recovery|native-source-contract-gaps|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))'
  published-python:
    name: pinned Python 1.2 recovery catalog value-by-value oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Pinned 27-metric schema and zero-based recovery key source oracle
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-functional-rqa-recovery",reporter="summary",stop_on_failure=TRUE)'
