name: Native FPCA envelope and paired FPCR bootstrap frozen source
on:
  pull_request:
    paths:
      - "R/native-fpca-component-envelopes.R"
      - "R/native-fpcr-bootstrap-uncertainty.R"
      - "R/native-fpca-stability.R"
      - "R/native-scalar-on-fpca-source.R"
      - "tests/testthat/test-native-fpca-envelopes-full-source-20261111.R"
      - "tests/testthat/test-native-fpcr-bootstrap-full-source-20261111.R"
      - "tests/testthat/test-native-fpca-component-envelopes.R"
      - "tests/testthat/test-native-fpcr-bootstrap-uncertainty.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/bootstrap_fpca_component_envelopes.json"
      - "docs/source_contract_reviews/bootstrap_fpca_regression_uncertainty.json"
      - ".github/workflows/native-fpca-bootstrap-envelope-paired-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned six-domain reviews and 400/508 source census
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          gaps=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          nonfunction=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          receipts=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          assert len(gaps)==203 and len(nonfunction)==1
          callable_missing=sum(row["unresolved_source_gap"]=="TRUE" for row in gaps)
          noncallable_missing=sum(row["unresolved"]=="TRUE" for row in nonfunction)
          assert callable_missing<=107 and noncallable_missing==1
          assert 508-callable_missing-noncallable_missing>=400
          names=("bootstrap_fpca_component_envelopes",
                 "bootstrap_fpca_regression_uncertainty")
          for name in names:
              record,=[r for r in gaps if r["python_name"]==name]
              assert record["unresolved_source_gap"]=="FALSE",name
              receipt,=[r for r in receipts if r["python_name"]==name]
              assert receipt["independently_certified"]=="FALSE",name
              raw=(root/receipt["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt["review_record_sha256"]
              review=json.loads(raw)
              assert review["python_name"]==name
              assert review["independently_certified"] is False
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {r["kind"] for r in review["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for evidence in review["native_files"]+review["case_evidence"]:
                  p=root/evidence["path"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==evidence["sha256"],str(p)
          print(f"{508-callable_missing-noncallable_missing}/508 provisional author-reviewed;"
                f" callable gaps={callable_missing}; noncallable={noncallable_missing};"
                " independent certifications=0")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native FPCA envelope and Gaussian paired-bootstrap source tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-fpca-envelopes-full-source-20261111|native-fpcr-bootstrap-full-source-20261111|native-fpca-component-envelopes|native-fpcr-bootstrap-uncertainty",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Frozen typed Python 1.2 FPCA component and FPCR paired refit oracles
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-fpca-envelopes-full-source-20261111|native-fpcr-bootstrap-full-source-20261111|native-fpca-component-envelopes|native-fpcr-bootstrap-uncertainty",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
