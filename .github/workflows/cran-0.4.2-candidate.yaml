name: 0.4.2 exact source CRAN candidate qualification

# Isolated release branch, no PR stack merge and no CRAN submission.
on:
  push:
    branches:
      - release/eyetrajectories-0.4.2-rc1-20261116
    paths:
      - 'DESCRIPTION'
      - 'NEWS.md'
      - 'README.md'
      - '.Rbuildignore'
      - 'cran-comments.md'
      - 'R/**'
      - 'man/**'
      - 'tests/**'
      - 'inst/**'
      - 'src/**'
      - 'scripts/check_release_candidate_tarball.R'
      - '.github/workflows/cran-0.4.2-candidate.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tarball:
    name: Build exact 0.4.2 source tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Build CRAN source archive
        shell: bash
        run: |
          set -euo pipefail
          R CMD build .
          test -s eyetrajectories_0.4.2.tar.gz
          sha256sum eyetrajectories_0.4.2.tar.gz | tee candidate.sha256
          Rscript -e 'cat(unname(tools::md5sum("eyetrajectories_0.4.2.tar.gz")), "\n", file = "candidate.md5")'
          ls -lh eyetrajectories_0.4.2.tar.gz
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: eyetrajectories-0.4.2-CRAN-source
          path: |
            eyetrajectories_0.4.2.tar.gz
            candidate.sha256
            candidate.md5
          retention-days: 30
          if-no-files-found: error

  check-exact-tarball:
    needs: build-tarball
    name: CRAN candidate / ${{ matrix.r }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1
          - os: ubuntu-latest
            r: devel
          - os: macos-latest
            r: release
          - os: windows-latest
            r: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      ET_RUN_PYTHON_TESTS: 'false'
      NOT_CRAN: 'false'
      MPLBACKEND: Agg
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: eyetrajectories-0.4.2-CRAN-source
          path: candidate
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          http-user-agent: release
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: ${{ runner.os == 'Windows' && 'TinyTeX' || 'TinyTeX-1' }}
      - name: Verify Windows Courier for PDF manual
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $kpsewhich = (Get-Command kpsewhich -ErrorAction Stop).Source
          $font = & $kpsewhich pcrr8t.tfm
          if (-not $font) {
            $tlmgr = (Get-Command tlmgr -ErrorAction Stop).Source
            & $tlmgr --repository https://mirrors.ibiblio.org/pub/mirrors/CTAN/systems/texlive/tlnet install courier
            if ($LASTEXITCODE -ne 0) { throw "Courier installation failed" }
            $font = & $kpsewhich pcrr8t.tfm
          }
          if (-not $font) { throw "Courier font metric missing" }
          Write-Host "WINDOWS_COURIER_FOUND: $font"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::V8, any::digest
          needs: check
      - name: Check V8 and run actual R CMD check --as-cran on exact tarball
        shell: Rscript {0}
        run: |
          source("scripts/check_release_candidate_tarball.R")
      - name: Upload CRAN qualification logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-check-${{ matrix.r }}-${{ matrix.os }}
          path: |
            check-outputs/
          if-no-files-found: warn
          retention-days: 21
