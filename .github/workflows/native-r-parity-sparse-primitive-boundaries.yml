name: Native sparse interpolation PSD and eigensystem source boundaries

on:
  pull_request:
    paths:
      - "R/native-sparse-source-pace-core.R"
      - "scripts/run_accelerated_scientific_wave.R"
      - "tests/testthat/test-native-sparse-primitive-source-boundaries.R"
      - ".github/workflows/native-r-parity-sparse-primitive-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r:
    name: Sparse primitive native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Parse and run source primitive and prior sparse regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          before <- reticulate::py_available(initialize=FALSE)
          testthat::test_local(".",filter="native-sparse-(primitive-source-boundaries|numpy-rank-boundary|pair-source-order|source-pace|mfpca-source)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))
          RSCRIPT

  python-oracle:
    name: Sparse primitive frozen Python 1.2 / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific oracle
        run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare sparse primitive numerical and error source contracts
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-sparse-(primitive-source-boundaries|numpy-rank-boundary|pair-source-order|source-pace|mfpca-source)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
