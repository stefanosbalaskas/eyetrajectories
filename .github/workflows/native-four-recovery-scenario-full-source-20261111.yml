name: Native four recovery scenario design contracts Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-functional-scenario-design.R"
      - "R/native-functional-recovery-design.R"
      - "R/native-functional-recovery-stress-design.R"
      - "tests/testthat/test-native-four-recovery-scenario-full-source-20261111.R"
      - "tests/testthat/test-native-functional-scenario-design.R"
      - "tests/testthat/test-native-functional-recovery-design.R"
      - "tests/testthat/test-native-functional-recovery-stress-design.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - ".github/workflows/native-four-recovery-scenario-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Recovery scenario designs R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native R full recovery design/source contract and regression tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          for(test in c("native-four-recovery-scenario-full-source-20261111",
            "native-functional-scenario-design",
            "native-functional-recovery-design",
            "native-functional-recovery-stress-design"))
            testthat::test_local(".",filter=test,reporter="summary",
              stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - name: Cross-check source gap ledger and SHA256 reviews
        if: runner.os == 'Linux'
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: Complete recovery scenario frames frozen Python 1.2 / ubuntu
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5" "pandas"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare all 23/26 columns for four scenario-related Python source contracts
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          for(test in c("native-four-recovery-scenario-full-source-20261111",
            "native-functional-scenario-design",
            "native-functional-recovery-design",
            "native-functional-recovery-stress-design"))
            testthat::test_local(".",filter=test,reporter="summary",
              stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: python scripts/source_gap_inventory.py
