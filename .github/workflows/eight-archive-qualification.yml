name: Eight-archive qualification runner synthetic contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qualify_onestop_eight_archives.R'
      - 'scripts/test_eight_archive_qualification.R'
      - 'docs/ONESTOP_EIGHT_ARCHIVE_QUALIFICATION.md'
      - '.github/workflows/eight-archive-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qualify_onestop_eight_archives.R'
      - 'scripts/test_eight_archive_qualification.R'
      - '.github/workflows/eight-archive-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-qualification-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ET_RUN_PYTHON_TESTS: 'false'
      ET_EIGHT_ARCHIVE_NO_AUTORUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R and ZIP test dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libuv1-dev libpng-dev libcurl4-openssl-dev libssl-dev zip
      - name: Install native test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('pkgload', 'testthat', 'reticulate'),
            repos=Sys.getenv('RSPM', 'https://cloud.r-project.org'))
      - name: Check script syntax and run synthetic fixtures
        shell: Rscript {0}
        run: |
          parse(file = 'scripts/qualify_onestop_eight_archives.R')
          parse(file = 'scripts/test_eight_archive_qualification.R')
          source('scripts/test_eight_archive_qualification.R')
          cat('EIGHT_ARCHIVE_QUALIFICATION_CI_PASS\n')
