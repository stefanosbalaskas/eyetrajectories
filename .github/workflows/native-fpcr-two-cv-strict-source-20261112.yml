name: Native FPCR ordinary and nested CV source scientific pair
on:
  pull_request:
    paths:
      - "R/native-fpcr-regression-cross-validation.R"
      - "R/native-fpcr-nested-cross-validation.R"
      - "R/native-fpcr-binomial-source.R"
      - "tests/testthat/test-native-fpcr-two-cv-strict-source-20261112.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/cross_validate_fpca_regression.json"
      - "docs/source_contract_reviews/nested_cross_validate_fpca_regression.json"
      - ".github/workflows/native-fpcr-two-cv-strict-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 416 provisional closures, 91 callable gaps, exact SHA256 receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p=Path(".")
          def rows(path):
              with (p/path).open(encoding="utf-8",newline="") as handle:
                  return list(csv.DictReader(handle))
          gaps=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          non=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          registry=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gaps)==203 and len(non)==1
          outstanding=sum(x["unresolved_source_gap"]=="TRUE" for x in gaps)
          noncallable=sum(x["unresolved"]=="TRUE" for x in non)
          assert outstanding==91 and noncallable==1
          assert 508-outstanding-noncallable==416
          for name in ("cross_validate_fpca_regression",
                       "nested_cross_validate_fpca_regression"):
              (gap,)=tuple(x for x in gaps if x["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE"
              (r,)=tuple(x for x in registry if x["python_name"]==name)
              assert r["independently_certified"]=="FALSE"
              data=(p/r["review_record_path"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==r["review_record_sha256"],name
              review=json.loads(data)
              assert review["python_name"]==name
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert review["independently_certified"] is False
              assert {e["kind"] for e in review["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for source in review["native_files"]+review["case_evidence"]:
                  f=p/source["path"]
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==source["sha256"],f
          print("416/508 provisional author reviews, 91 callable + 1 noncallable, 0 external certificates")
          PY

  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Source CV result schemas, folds, numerical estimands and legacy stability
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-fpcr-two-cv-strict-source-20261112|native-fpcr-regression-cross-validation|native-fpcr-nested-cross-validation|native-fpcr-binomial-glm",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT

  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Direct frozen Python ordinary + nested Gaussian/binomial CV
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-fpcr-two-cv-strict-source-20261112|native-fpcr-regression-cross-validation|native-fpcr-nested-cross-validation|native-fpcr-binomial-glm",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
