name: Native sparse MFPCA paired and asynchronous W2 source
on:
  pull_request:
    paths:
      - "R/native-sparse-joint-score-workflows.R"
      - "R/native-sparse-mfpca-w2-source-workflow-record.R"
      - "R/native-sparse-mfpca-source.R"
      - "R/native-sparse-mfpca-async-source.R"
      - "tests/testthat/test-native-sparse-mfpca-paired-async-w2-source-20261112.R"
      - "docs/source_contract_reviews/run_sparse_mfpca_workflow.json"
      - "docs/source_contract_reviews/run_sparse_mfpca_async_workflow.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-sparse-mfpca-paired-async-w2-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 419/508 ledger, source-reviewed pair and SHA256 receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def rows(p):
              with (root/p).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          gaps=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          nc=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reg=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          n=sum(x["unresolved_source_gap"]=="TRUE" for x in gaps)
          m=sum(x["unresolved"]=="TRUE" for x in nc)
          assert len(gaps)==203 and len(nc)==1
          assert (n,m,508-n-m)==(88,1,419)
          names=("run_sparse_mfpca_workflow",
                 "run_sparse_mfpca_async_workflow")
          for name in names:
              (gap,)=tuple(x for x in gaps if x["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE"
              (r,)=tuple(x for x in reg if x["python_name"]==name)
              assert r["independently_certified"]=="FALSE"
              raw=(root/r["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==r["review_record_sha256"]
              review=json.loads(raw)
              assert review["python_name"]==name
              assert review["independently_certified"] is False
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {x["kind"] for x in review["case_evidence"]}=={
                "source_signature","accepted_input_domain","numerical_outputs",
                "exception_semantics","returned_schema","scientific_estimand"}
              for source in review["native_files"]+review["case_evidence"]:
                  file=root/source["path"]
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==source["sha256"],file
          print("419/508 source-scientific developer-reviewed, 88 callable gaps, one noncallable; 0 independent certificates")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Run native paired/async source W2 and scientific PACE regression tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-sparse-mfpca-paired-async-w2-source-20261112|native-sparse-mfpca-source|native-sparse-mfpca-async-source",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Frozen 1.2 direct paired/async MFPCA workflows and estimator arrays
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-sparse-mfpca-paired-async-w2-source-20261112|native-sparse-mfpca-source|native-sparse-mfpca-async-source",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
