name: Native generalized GEE fit and W3 workflow frozen Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-generalized-gee-fit.R"
      - "R/native-generalized-gee-source-scientific-record.R"
      - "R/native-generalized-gee-workflow.R"
      - "R/native-generalized-gee-bootstrap.R"
      - "R/native-generalized-gee-solver.R"
      - "tests/testthat/test-native-generalized-gee-fit-workflow-full-source-20261112.R"
      - "tests/testthat/test-native-generalized-gee-fit.R"
      - "tests/testthat/helper-native-generalized-gee-fixture.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/fit_generalized_function_on_scalar_regression.json"
      - "docs/source_contract_reviews/run_generalized_functional_workflow.json"
      - ".github/workflows/native-generalized-gee-fit-workflow-full-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact SHA256 GEE source contracts and 413/508 provisional ledger
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          gaps=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          noncallable=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          registry=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          assert len(gaps)==203 and len(noncallable)==1
          missing=sum(item["unresolved_source_gap"]=="TRUE" for item in gaps)
          nc=sum(item["unresolved"]=="TRUE" for item in noncallable)
          assert missing<=94 and nc==1,(missing,nc)
          assert 508-missing-nc>=413
          for name in ("fit_generalized_function_on_scalar_regression",
                       "run_generalized_functional_workflow"):
              (gap,)=tuple(item for item in gaps if item["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE"
              (record,)=tuple(item for item in registry if item["python_name"]==name)
              assert record["independently_certified"]=="FALSE"
              raw=(root/record["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==record["review_record_sha256"],name
              review=json.loads(raw)
              assert review["python_name"]==name
              assert review["independently_certified"] is False
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in review["case_evidence"]}=={
                "source_signature","accepted_input_domain","numerical_outputs",
                "exception_semantics","returned_schema","scientific_estimand"}
              assert "native_R_source_score_GEE" in review["native_language_semantic_policy"]
              for item in review["native_files"]+review["case_evidence"]:
                  source=root/item["path"]
                  assert hashlib.sha256(source.read_bytes()).hexdigest()==item["sha256"],source
          print(f"{508-missing-nc}/508 provisional author reviews; "
                f"{missing} callable gaps + {nc} noncallable; "
                "zero independently certified")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native GEE source schema, model fit, bootstrap refit and workflow tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-generalized-gee-fit-workflow-full-source-20261112|native-generalized-gee-fit|native-generalized-gee-bootstrap",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Real frozen Statsmodels Poisson, exposure, Bernoulli and grouped-binomial GEE scientific oracle
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-generalized-gee-fit-workflow-full-source-20261112|native-generalized-gee-fit|native-generalized-gee-bootstrap",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
