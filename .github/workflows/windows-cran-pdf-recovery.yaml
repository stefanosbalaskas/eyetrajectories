name: Windows CRAN PDF manual recovery (isolated)

# Only the single Windows scientific package check is auto-triggered on
# changes to this short-lived CI-fix branch. No large PR matrix or Pages.
on:
  push:
    branches:
      - fix/ci-matrix-oracle-validation-20261115
    paths:
      - .github/workflows/windows-cran-pdf-recovery.yaml
      - .github/workflows/R-cross-platform-manual.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cran:
    name: Windows R --as-cran with PDF manual
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ET_RUN_PYTHON_TESTS: 'false'
      NOT_CRAN: 'false'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      - name: Verify Courier for PDF manual
        shell: pwsh
        timeout-minutes: 7
        run: |
          $ErrorActionPreference = 'Stop'
          $kpsewhich = (Get-Command kpsewhich -ErrorAction Stop).Source
          $font = & $kpsewhich pcrr8t.tfm
          if (-not $font) {
            $mirror = 'https://mirrors.ibiblio.org/pub/mirrors/CTAN/systems/texlive/tlnet'
            $tlmgr = (Get-Command tlmgr -ErrorAction Stop).Source
            Write-Host "Courier absent; installing from $mirror"
            & $tlmgr --repository $mirror install courier
            if ($LASTEXITCODE -ne 0) { throw "Courier installation failed: $LASTEXITCODE" }
            $font = & $kpsewhich pcrr8t.tfm
          }
          if (-not $font) { throw "Missing font metric pcrr8t.tfm" }
          Write-Host "WINDOWS_COURIER_FOUND: $font"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Full CRAN-style package check with PDF manual
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'
