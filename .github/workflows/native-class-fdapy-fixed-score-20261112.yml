name: Native TrajectorySet class source and FDApy PACE conditional score
on:
  pull_request:
    paths:
      - "R/native-trajectory-source-class-record-20261112.R"
      - "R/native-fdapy-fixed-spectrum-pace-source.R"
      - "R/native-thirdparty-functional-analogues.R"
      - "tests/testthat/test-native-trajectory-class-source-record-20261112.R"
      - "tests/testthat/test-native-fdapy-fixed-spectrum-pace-source-20261112.R"
      - "inst/extdata/native_nonfunction_contract_review_v1.csv"
      - "inst/extdata/native_nonfunction_source_gaps_v1.csv"
      - "inst/extdata/native_scoped_fdapy_submethod_gaps_20261112.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "docs/source_contract_reviews/TrajectorySet.json"
      - "docs/source_contract_reviews/fit_sparse_fpca_fdapy_fixed_spectrum_stage.json"
      - "docs/source_contract_reviews/to_skfda_basis.json"
      - "docs/source_contract_reviews/to_skfda_grid.json"
      - "docs/source_contract_reviews/to_fdapy_irregular.json"
      - "docs/source_contract_reviews/detect_functional_outliers_skfda.json"
      - "NAMESPACE"
      - "man/native-api.Rd"
      - "man/etr_native_release_source_bridge_reporting.Rd"
      - ".github/workflows/native-class-fdapy-fixed-score-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-source-inventory-sha256:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert provisional 505 with 3 callable and zero noncallable source gaps; FDAPY fitted stage open
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib
          root=Path(".")
          def rows(name):
              with (root/name).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          api=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          classes=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          class_review=rows("inst/extdata/native_nonfunction_contract_review_v1.csv")
          registry=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          sub=rows("inst/extdata/native_scoped_fdapy_submethod_gaps_20261112.csv")
          assert len(api)==203
          assert len(classes)>=1
          assert len(registry)>=195
          assert len({r["python_name"] for r in registry})==len(registry)
          unresolved_api=sum(r["unresolved_source_gap"]=="TRUE" for r in api)
          unresolved_classes=sum(r["unresolved"]=="TRUE" for r in classes)
          assert unresolved_api==3,unresolved_api
          assert unresolved_classes==0,unresolved_classes
          assert 508-unresolved_api-unresolved_classes==505
          (classgap,)=tuple(r for r in classes if r["python_name"]=="TrajectorySet")
          assert classgap["unresolved"]=="FALSE"
          (classstate,)=tuple(r for r in class_review if r["python_name"]=="TrajectorySet")
          assert classstate["evidence_state"]=="author_scoped_reviewed"
          assert classstate["native_representation"]=="etr_trajectory_set"
          for field in ("numerical_or_value_approved","schema_boundary_approved",
                        "scientific_scope_approved","independent_reviewer_approved"):
              assert classstate[field]=="FALSE",field
          (fitgap,)=tuple(r for r in api if r["python_name"]=="fit_sparse_fpca_fdapy")
          assert fitgap["unresolved_source_gap"]=="TRUE"
          stages={r["source_stage"]:r for r in sub}
          assert stages["UFPCA_fit_PS_LP_mean_and_covariance"]["source_gap_open"]=="TRUE"
          assert stages["postfit_fixed_spectrum_PACE_scores"]["source_gap_open"]=="FALSE"
          assert stages["normalize_true"]["source_gap_open"]=="TRUE"
          ns=(root/"NAMESPACE").read_text()
          assert "export(etr_trajectory_source_class_record)" in ns
          for name in ("TrajectorySet","to_skfda_grid","to_fdapy_irregular",
                       "to_skfda_basis","detect_functional_outliers_skfda"):
              (entry,)=tuple(r for r in registry if r["python_name"]==name)
              assert entry["independently_certified"]=="FALSE"
              b=(root/entry["review_record_path"]).read_bytes()
              assert hashlib.sha256(b).hexdigest()==entry["review_record_sha256"],name
              record=json.loads(b)
              assert record["independently_certified"] is False
              assert {v["kind"] for v in record["case_evidence"]}=={
                  "source_signature","accepted_input_domain",
                  "numerical_outputs","exception_semantics",
                  "returned_schema","scientific_estimand"}
              for evidence in record["native_files"]+record["case_evidence"]+record.get("additional_regression_evidence",[]):
                  file=root/evidence["path"]
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==evidence["sha256"],file
          memo=json.loads((root/"docs/source_contract_reviews/fit_sparse_fpca_fdapy_fixed_spectrum_stage.json").read_text())
          assert memo["source_export_gap_open"] is True
          assert memo["source_fit_full_parity"] is False
          for entry in memo["native_source_files"]+memo["numerical_evidence"]:
              file=root/entry["path"]
              assert hashlib.sha256(file.read_bytes()).hexdigest()==entry["sha256"],file
          print("505/508 provisional source scientific data contracts; 3 callable remain, 0 noncallable; FDApy UFPCA fit remains OPEN; zero independent certificates")
          PY
  native-r-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Source trajectory class methods, FDApy pooled PACE conditional scoring, full 508 ledger
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-trajectory-class-source-record-20261112|native-fdapy-fixed-spectrum-pace-source-20261112|native-source-trajectory-object|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-real-dataclass-and-fdapy:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - name: Install real pinned Python 1.2 and FDApy 1.0.3; NumPy 1.x compatibility for FDApy
        run: python -m pip install "eyetrajectoriespy==1.2.0" "FDApy==1.0.3" "numpy==1.26.4"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Compare actual public frozen TrajectorySet and real FDApy _transform_pace_irregular fixed-spectrum stage
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          stopifnot(identical(as.character(
            reticulate::import("numpy")$__version__),"1.26.4"))
          testthat::test_local(".",
            filter="native-trajectory-class-source-record-20261112|native-fdapy-fixed-spectrum-pace-source-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
