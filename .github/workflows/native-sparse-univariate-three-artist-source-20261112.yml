name: Native sparse FPCA and irregular source artist geometry
on:
  pull_request:
    paths:
      - "R/native-sparse-scientific-graphics.R"
      - "R/native-sparse-univariate-artist-source.R"
      - "tests/testthat/test-native-sparse-univariate-three-artist-source-20261112.R"
      - "tests/testthat/test-native-sparse-scientific-graphics.R"
      - "docs/source_contract_reviews/plot_sparse_fpca_covariance.json"
      - "docs/source_contract_reviews/plot_sparse_fpca_component.json"
      - "docs/source_contract_reviews/plot_sparse_irregular_dimension.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-sparse-univariate-three-artist-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-domain-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native 435/508 development source registry and reproducible SHA256
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def rows(path):
              with (root/path).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          gap=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          other=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          registry=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gap)==203 and len(other)==1
          pending=sum(x["unresolved_source_gap"]=="TRUE" for x in gap)
          noncallable=sum(x["unresolved"]=="TRUE" for x in other)
          assert pending<=72 and noncallable<=1
          assert 508-pending-noncallable>=435
          for name in (
              "plot_sparse_fpca_covariance",
              "plot_sparse_fpca_component",
              "plot_sparse_irregular_dimension"):
              (entry,)=tuple(x for x in gap if x["python_name"]==name)
              assert entry["unresolved_source_gap"]=="FALSE"
              (record,)=tuple(x for x in registry if x["python_name"]==name)
              assert record["independently_certified"]=="FALSE"
              raw=(root/record["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==record["review_record_sha256"]
              review=json.loads(raw)
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert review["independently_certified"] is False
              assert {z["kind"] for z in review["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for evidence in review["native_files"]+review["case_evidence"]+review["additional_regression_evidence"]:
                  path=root/evidence["path"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==evidence["sha256"],path
          print(f"Development review count {508-pending-noncallable}/508; "
                f"callable unresolved {pending}, noncallable unresolved {noncallable}. "
                "No independent certifications granted.")
          PY
  three-os-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Direct scientific sparse PACE, original irregular samples and 7-plot source regression
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-sparse-univariate-three-artist-source-20261112|native-sparse-scientific-graphics",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare native fitted PACE geometry against pinned Python matplotlib image, lines, and irregular samples
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-sparse-univariate-three-artist-source-20261112|native-sparse-scientific-graphics",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
