name: Native functional inference plots and published Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-functional-inference-visuals.R"
      - "tests/testthat/test-native-functional-inference-visuals.R"
      - "R/native-full-parity-ledger.R"
      - "inst/extdata/native_source_contract_gaps_.csv"
      - "NAMESPACE"
      - ".github/workflows/native-functional-inference.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Native functional inference and stage-free public function names / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Parse new public scientific source and all its direct tests
        shell: bash
        run: |
          Rscript -e 'parse(file="R/native-functional-inference-visuals.R"); parse(file="tests/testthat/test-native-functional-inference-visuals.R")'
      - name: Execute numerical source geometry and strict frozen API census
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); before<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-functional-inference-visuals|native-functional-registration-plots|native-source-contract-gaps|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))'
  python-source:
    name: Published Python 1.2 real fitted FOS and conservative conformal oracles
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Published Python source FOS fit and conformal p-value/wording
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-functional-inference-visuals",reporter="summary",stop_on_failure=TRUE)'
