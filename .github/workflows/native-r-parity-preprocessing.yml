name: Native R preprocessing and trajectory distances

on:
  pull_request:
    paths:
      - "R/native-preprocessing-distances.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "tests/testthat/test-native-preprocessing-distances.R"
      - "tests/testthat/test-native-parity-ledger.R"
      - "tests/testthat/test-full-native-r-parity-ledger.R"
      - ".github/workflows/native-r-parity-preprocessing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r-no-python:
    name: Native on ${{ matrix.os }} (no Python runtime)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native preprocessing and distances (Python not initialized)
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE); before <- reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="(?:native-parity-ledger|native-preprocessing-distances)|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(reticulate::py_available(initialize=FALSE),before))
          RSCRIPT

  python-reference-oracle:
    name: Native versus Python 1.2 / Linux
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Set exact published Python reference version
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin Python backend
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare seven native algorithms and schemas against Python
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="(?:native-parity-ledger|native-preprocessing-distances)",reporter="summary",stop_on_failure=TRUE)'
