name: Native R Stage 19 numerical multiverse and FPCA clustering
on:
  pull_request:
    paths:
      - "R/native-stage19-*.R"
      - "R/native-full-parity-ledger.R"
      - "tests/testthat/test-native-stage19-multiverse-clustering.R"
      - "NAMESPACE"
      - ".github/workflows/native-r-parity-stage19.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Stage 19 native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native exhaustive sensitivity, FPCA K-means and strict frozen census
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-stage19-multiverse-clustering|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))'
  python-v1-2-oracle:
    name: Stage 19 published Python 1.2 distances and LLE numerical oracle
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare raw distance matrices, neighbor identity and explicit LLE
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-stage19-multiverse-clustering",reporter="summary",stop_on_failure=TRUE)'
