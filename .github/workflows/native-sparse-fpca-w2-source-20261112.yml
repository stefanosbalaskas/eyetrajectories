name: Native sparse FPCA W2 workflow frozen Python scientific source
on:
  pull_request:
    paths:
      - "R/native-bounded-model-workflows.R"
      - "R/native-sparse-fpca-w2-source-workflow-record.R"
      - "R/native-sparse-source-pace.R"
      - "tests/testthat/test-native-sparse-fpca-w2-workflow-strict-20261112.R"
      - "tests/testthat/test-native-sparse-source-pace.R"
      - "docs/source_contract_reviews/run_sparse_fpca_workflow.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-sparse-fpca-w2-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check full 508 source export ledger and six-domain SHA256 receipt
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def rows(path):
              with (root/path).open(encoding="utf-8",newline="") as handle:
                  return list(csv.DictReader(handle))
          gaps=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          nc=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reg=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gaps)==203 and len(nc)==1
          n=sum(x["unresolved_source_gap"]=="TRUE" for x in gaps)
          m=sum(x["unresolved"]=="TRUE" for x in nc)
          assert n==90 and m==1 and 508-n-m==417
          (entry,)=tuple(x for x in gaps if x["python_name"]=="run_sparse_fpca_workflow")
          assert entry["unresolved_source_gap"]=="FALSE"
          (r,)=tuple(x for x in reg if x["python_name"]=="run_sparse_fpca_workflow")
          assert r["independently_certified"]=="FALSE"
          raw=(root/r["review_record_path"]).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==r["review_record_sha256"]
          review=json.loads(raw)
          assert review["python_name"]=="run_sparse_fpca_workflow"
          assert review["independently_certified"] is False
          assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
          assert {e["kind"] for e in review["case_evidence"]}=={
            "source_signature","accepted_input_domain","numerical_outputs",
            "exception_semantics","returned_schema","scientific_estimand"}
          for x in review["native_files"]+review["case_evidence"]:
              f=root/x["path"]
              assert hashlib.sha256(f.read_bytes()).hexdigest()==x["sha256"],f
          print("417/508 provisional author-reviewed; 90 callable gaps, 1 noncallable; 0 certified")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Strict sparse W2 source schema and native PACE estimator
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-sparse-fpca-w2-workflow-strict-20261112|native-sparse-source-pace",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Direct Python W2 fixed/uncertainty workflow oracle and native source PACE
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-sparse-fpca-w2-workflow-strict-20261112|native-sparse-source-pace",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
