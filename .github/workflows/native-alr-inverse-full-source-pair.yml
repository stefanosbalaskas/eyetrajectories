name: Native ALR transform and inverse frozen Python 1.2 differential
on:
  pull_request:
    paths:
      - "R/native-functional-diagnostics.R"
      - "tests/testthat/test-native-alr-inverse-full-source-pair.R"
      - "tests/testthat/test-native-alr-empty-source-boundaries.R"
      - "tests/testthat/test-native-alr-numpy-complex-source.R"
      - "tests/testthat/test-native-alr-mixed-nested-source.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - ".github/workflows/native-alr-inverse-full-source-pair.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Compositional ALR forward inverse native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Test both source functional compositions, numerical and exceptional domains
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-alr-(inverse-full-source-pair|empty-source-boundaries|numpy-complex-source|mixed-nested-source)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - name: Source-gap integrity gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: Compositional ALR forward inverse Python 1.2 / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Direct Python source ALR transform inverse differential
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-alr-(inverse-full-source-pair|empty-source-boundaries|numpy-complex-source|mixed-nested-source)",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: python scripts/source_gap_inventory.py
