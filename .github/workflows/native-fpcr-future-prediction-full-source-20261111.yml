name: Native future outcome FPCR prediction frozen Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-fpcr-future-prediction-interval.R"
      - "R/native-fpcr-bootstrap-uncertainty.R"
      - "tests/testthat/test-native-fpcr-future-full-source-20261111.R"
      - "tests/testthat/test-native-fpcr-future-prediction-interval.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/fpca_regression_future_prediction_interval.json"
      - ".github/workflows/native-fpcr-future-prediction-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-domain-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current 403/508 ledger, source review and exact SHA256 evidence
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          gap=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          classes=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          registry=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          assert len(gap)==203 and len(classes)==1
          missing=sum(item["unresolved_source_gap"]=="TRUE" for item in gap)
          class_missing=sum(item["unresolved"]=="TRUE" for item in classes)
          assert missing<=104 and class_missing==1, (missing,class_missing)
          assert 508-missing-class_missing>=403
          key="fpca_regression_future_prediction_interval"
          (target,)=tuple(x for x in gap if x["python_name"]==key)
          assert target["unresolved_source_gap"]=="FALSE"
          (receipt,)=tuple(x for x in registry if x["python_name"]==key)
          assert receipt["independently_certified"]=="FALSE"
          document=(root/receipt["review_record_path"]).read_bytes()
          assert hashlib.sha256(document).hexdigest()==receipt["review_record_sha256"]
          review=json.loads(document)
          assert review["python_name"]==key
          assert review["independently_certified"] is False
          assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
          assert {item["kind"] for item in review["case_evidence"]}=={
              "source_signature","accepted_input_domain","numerical_outputs",
              "exception_semantics","returned_schema","scientific_estimand"
          }
          for entry in review["native_files"]+review["case_evidence"]:
              assert hashlib.sha256((root/entry["path"]).read_bytes()).hexdigest()==entry["sha256"],entry["path"]
          print(f"{508-missing-class_missing}/508 provisional author-reviewed; "
                f"{missing} callable + {class_missing} noncallable open;"
                " no independent certifications")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native source-mode FPCR paired bootstrap to future prediction tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-fpcr-future-full-source-20261111|native-fpcr-future-prediction-interval|native-fpcr-bootstrap-full-source-20261111",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Real typed frozen Python Gaussian FPCR and SeedSequence future intervals
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-fpcr-future-full-source-20261111|native-fpcr-future-prediction-interval|native-fpcr-bootstrap-full-source-20261111",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
