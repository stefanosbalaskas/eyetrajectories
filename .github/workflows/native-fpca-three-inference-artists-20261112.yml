name: Native FPCA three inference scientific source artists
on:
  pull_request:
    paths:
      - "R/native-fpca-inference-source-graphics.R"
      - "R/native-fpcr-inference-plots.R"
      - "R/native-fpca-three-inference-artist-source.R"
      - "tests/testthat/test-native-fpca-three-inference-artists-20261112.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_fpca_component_envelope.json"
      - "docs/source_contract_reviews/plot_fpca_wild_bootstrap_projection.json"
      - "docs/source_contract_reviews/plot_fpca_wild_bootstrap_family_test.json"
      - ".github/workflows/native-fpca-three-inference-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 457 reviewed native records, strict CSV, source SHA256 receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, hashlib
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              newline="",encoding="utf-8") as f:
              raw=list(csv.reader(f,strict=True))
          assert len(raw)==204,len(raw)
          assert all(len(x)==7 for x in raw),[
              (i,len(x),x[0]) for i,x in enumerate(raw) if len(x)!=7]
          assert len({x[0] for x in raw[1:]})==203
          assert all(x[-1] in ("TRUE","FALSE") for x in raw[1:])
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              newline="",encoding="utf-8") as f:
              non=list(csv.DictReader(f))
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              newline="",encoding="utf-8") as f:
              registry=list(csv.DictReader(f))
          assert len(non)==1
          assert len({x["python_name"] for x in registry})==len(registry)
          target=("plot_fpca_component_envelope",
                  "plot_fpca_wild_bootstrap_projection",
                  "plot_fpca_wild_bootstrap_family_test")
          for name in target:
              (gap,)=tuple(x for x in raw[1:] if x[0]==name)
              assert gap[-1]=="FALSE",name
              (rec,)=tuple(x for x in registry if x["python_name"]==name)
              assert rec["author_full_contract_decision"]=="AUTHOR_SCOPED_CONTRACT_REVIEWED"
              assert rec["independently_certified"]=="FALSE"
              data=(root/rec["review_record_path"]).read_bytes()
              assert hashlib.sha256(data).hexdigest()==rec["review_record_sha256"]
              obj=json.loads(data)
              assert obj["independently_certified"] is False
              assert obj["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in obj["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for entry in obj["native_files"]+obj["case_evidence"]+obj["additional_regression_evidence"]:
                  source=root/entry["path"]
                  assert hashlib.sha256(source.read_bytes()).hexdigest()==entry["sha256"],source
          callable_gaps=sum(x[-1]=="TRUE" for x in raw[1:])
          other_gaps=sum(x["unresolved"]=="TRUE" for x in non)
          assert callable_gaps<=50,callable_gaps
          assert other_gaps<=1,other_gaps
          assert 508-callable_gaps-other_gaps>=457
          print("457/508 scoped developer reviewed, 50 callable gaps + 1 noncallable, 0 independently certified")
          PY
  native-r:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Validate three R native scientific artists
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-fpca-three-inference-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  python-1-2-oracle:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Compare frozen Python Matplotlib artists with R source geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-fpca-three-inference-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
