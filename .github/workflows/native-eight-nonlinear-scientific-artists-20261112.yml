name: Native eight nonlinear scientific source artists
on:
  pull_request:
    paths:
      - "R/native-scientific-visualization.R"
      - "R/native-eight-nonlinear-scientific-artists.R"
      - "tests/testthat/test-native-eight-nonlinear-scientific-artists-20261112.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_embedding_delay_diagnostics.json"
      - "docs/source_contract_reviews/plot_embedding_dimension_diagnostics.json"
      - "docs/source_contract_reviews/plot_recurrence_network_degree.json"
      - "docs/source_contract_reviews/plot_recurrence_rate_curve.json"
      - "docs/source_contract_reviews/plot_windowed_rqa.json"
      - "docs/source_contract_reviews/plot_local_divergence.json"
      - "docs/source_contract_reviews/plot_surrogate_nonlinearity.json"
      - "docs/source_contract_reviews/plot_poincare_return_map.json"
      - ".github/workflows/native-eight-nonlinear-scientific-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict-source scientific reviews and 476/508 authoritative records
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              newline="",encoding="utf-8") as f:
              rows=list(csv.reader(f,strict=True))
          assert len(rows)==204,len(rows)
          assert len({r[0] for r in rows[1:]})==203
          assert all(len(r)==7 for r in rows)
          assert all(r[-1] in ("TRUE","FALSE") for r in rows[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              newline="",encoding="utf-8") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              newline="",encoding="utf-8") as f:
              other=list(csv.DictReader(f))
          assert len(registry)>=166,len(registry)
          assert len({r["python_name"] for r in registry})==len(registry)
          names=(
              "plot_embedding_delay_diagnostics",
              "plot_embedding_dimension_diagnostics",
              "plot_recurrence_network_degree",
              "plot_recurrence_rate_curve",
              "plot_windowed_rqa",
              "plot_local_divergence",
              "plot_surrogate_nonlinearity",
              "plot_poincare_return_map")
          for name in names:
              (gap,)=tuple(r for r in rows[1:] if r[0]==name)
              assert gap[-1]=="FALSE",name
              (reg,)=tuple(r for r in registry if r["python_name"]==name)
              assert reg["independently_certified"]=="FALSE",name
              raw=(root/reg["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==reg["review_record_sha256"],name
              record=json.loads(raw)
              assert record["independently_certified"] is False
              assert record["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {ev["kind"] for ev in record["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for entry in (record["native_files"]+record["case_evidence"]+
                            record.get("additional_regression_evidence",[])):
                  src=root/entry["path"]
                  assert hashlib.sha256(src.read_bytes()).hexdigest()==entry["sha256"],src
          callable_gaps=sum(r[-1]=="TRUE" for r in rows[1:])
          noncallable_gaps=sum(r["unresolved"]=="TRUE" for r in other)
          assert callable_gaps<=31,callable_gaps
          assert noncallable_gaps<=1,noncallable_gaps
          assert 508-callable_gaps-noncallable_gaps>=476
          print("476/508 provisional author-scoped scientific artist records; <=31 callable + <=1 noncallable gaps; no independent certifications")
          PY
  native-r-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native scientific nonlinear eight tests, legacy and ledger
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-eight-nonlinear-scientific-artists-20261112|native-scientific-visualization|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Compare frozen Python 1.2 nonlinear Matplotlib artists with native R geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-eight-nonlinear-scientific-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
