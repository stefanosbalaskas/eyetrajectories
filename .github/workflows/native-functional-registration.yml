name: Native functional registration and clean public API qualification
on:
  pull_request:
    paths:
      - "R/native-functional-registration-plots.R"
      - "tests/testthat/test-native-functional-registration-plots.R"
      - "R/native-nine-scientific-plots.R"
      - "R/native-functional-rqa-recovery.R"
      - "R/native-fpca-bootstrap-source.R"
      - "R/native-math-contracts-diagnostics.R"
      - "R/native-transfer-entropy-visual.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - ".github/workflows/native-functional-registration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Native functional plots and clean API / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Parse and reject stage-numbered public names
        shell: bash
        run: |
          Rscript -e 'invisible(lapply(list.files("R",pattern="\\.R$",full.names=TRUE),parse)); exports<-readLines("NAMESPACE"); stopifnot(!any(grepl("export\\(etr[0-9]+_",exports)))'
      - name: Complete registration plot and historical parity test contexts
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); prev<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-functional-registration-plots|native-nine-scientific-plots|native-functional-rqa-recovery|native-fpca-bootstrap-source|native-math-contracts-diagnostics|native-transfer-entropy-visual|native-source-contract-gaps|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(prev,reticulate::py_available(initialize=FALSE)))'
  python-source:
    name: Published Python 1.2 reconstruction and warping source geometry
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Exact pinned source reconstruction curve and warped-time geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-functional-registration-plots",reporter="summary",stop_on_failure=TRUE)'
