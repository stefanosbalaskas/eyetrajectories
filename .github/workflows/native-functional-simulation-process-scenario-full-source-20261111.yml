name: Native functional simulation process and scenario frozen Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-functional-simulation-source-boundary.R"
      - "R/native-functional-process-simulation.R"
      - "R/native-functional-simulation-irregular.R"
      - "R/native-functional-recovery-orchestration.R"
      - "tests/testthat/test-native-functional-simulation-process-scenario-full-source-20261111.R"
      - "tests/testthat/test-native-functional-simulation-seeded.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/simulate_functional_process.json"
      - "docs/source_contract_reviews/simulate_functional_scenario.json"
      - ".github/workflows/native-functional-simulation-process-scenario-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 405/508 source ledger and SHA256 simulation review evidence
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          rows=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          nc=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          receipts=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          assert len(rows)==203 and len(nc)==1
          gap=sum(x["unresolved_source_gap"]=="TRUE" for x in rows)
          classgap=sum(x["unresolved"]=="TRUE" for x in nc)
          assert gap<=102 and classgap==1,(gap,classgap)
          assert 508-gap-classgap>=405
          for name in ("simulate_functional_process","simulate_functional_scenario"):
              (row,)=tuple(x for x in rows if x["python_name"]==name)
              assert row["unresolved_source_gap"]=="FALSE",name
              (receipt,)=tuple(x for x in receipts if x["python_name"]==name)
              assert receipt["independently_certified"]=="FALSE",name
              raw=(root/receipt["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt["review_record_sha256"]
              review=json.loads(raw)
              assert review["python_name"]==name
              assert review["independently_certified"] is False
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in review["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for item in review["native_files"]+review["case_evidence"]:
                  f=root/item["path"]
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==item["sha256"],f
          print(f"{508-gap-classgap}/508 provisional author-reviewed; "
                f"{gap} callable + {classgap} noncallable remain; "
                "zero independently certified")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native seeded process/scenario science, irregular and student-t tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-functional-simulation-process-scenario-full-source-20261111|native-functional-simulation-seeded|native-functional-simulation-irregular-source|native-functional-simulation-student-t-source",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Actual frozen Python 1.2 dense/irregular truth and scenario provenance oracle
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-functional-simulation-process-scenario-full-source-20261111|native-functional-simulation-seeded|native-functional-simulation-irregular-source|native-functional-simulation-student-t-source",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
