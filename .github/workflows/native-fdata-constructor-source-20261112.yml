name: Native FDataGrid and FDApy irregular source constructor geometry
on:
  pull_request:
    paths:
      - "R/native-thirdparty-functional-analogues.R"
      - "tests/testthat/test-native-skfda-fdapy-scientific-records-20261112.R"
      - "man/etr_native_release_source_bridge_reporting.Rd"
      - "docs/source_contract_reviews/to_skfda_grid.json"
      - "docs/source_contract_reviews/to_fdapy_irregular.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-fdata-constructor-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provisional 502 of 508 and both six-domain SHA256 source records
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          def csvrows(p):
              with (root/p).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          gaps=csvrows("inst/extdata/native_source_contract_gaps_stage22.csv")
          nc=csvrows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reviews=csvrows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gaps)==203,len(gaps)
          assert len(reviews)>=192,len(reviews)
          assert len({r["python_name"] for r in reviews})==len(reviews)
          callable=sum(r["unresolved_source_gap"]=="TRUE" for r in gaps)
          noncallable=sum(r["unresolved"]=="TRUE" for r in nc)
          assert callable<=5,callable
          assert noncallable<=1,noncallable
          assert 508-callable-noncallable>=502
          for name in ("to_skfda_grid","to_fdapy_irregular"):
              (row,)=tuple(r for r in reviews if r["python_name"]==name)
              (gap,)=tuple(r for r in gaps if r["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE",name
              assert row["independently_certified"]=="FALSE"
              raw=(root/row["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row["review_record_sha256"],name
              obj=json.loads(raw)
              assert obj["independently_certified"] is False
              assert obj["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in obj["case_evidence"]}=={
                  "source_signature","accepted_input_domain",
                  "numerical_outputs","exception_semantics",
                  "returned_schema","scientific_estimand"},name
              for e in (obj["native_files"]+obj["case_evidence"]+
                        obj.get("additional_regression_evidence",[])):
                  p=root/e["path"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==e["sha256"],p
          print("502/508 provisional constructor-scientific records, 5 callable + 1 noncallable gap; 0 independent complete-contract certifications")
          PY
  native-r-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Execute native constructor, legacy, and parity ledger source regressions
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-skfda-fdapy-scientific-records-20261112|native-thirdparty-functional-analogues|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Frozen public Python 1.2 optional-constructor call witnesses
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          stopifnot(identical(as.character(
            reticulate::import("numpy")$__version__),"2.3.5"))
          testthat::test_local(".",
            filter="native-skfda-fdapy-scientific-records-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
