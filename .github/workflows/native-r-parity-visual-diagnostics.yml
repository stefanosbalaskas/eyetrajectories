name: Native R visual integration and contract ledger
on:
  pull_request:
    paths:
      - "R/native-visual-diagnostics.R"
      - "R/native-full-parity-ledger.R"
      - "NAMESPACE"
      - "man/etr_native_visual_diagnostics.Rd"
      - "tests/testthat/test-native-visual-diagnostics.R"
      - "tests/testthat/test-native-source-boundaries.R"
      - ".github/workflows/native-r-parity-visual-diagnostics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Source-aligned plot geometry and ledger / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native plots, certificate census, and Python-bridge isolation
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); was<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-visual-diagnostics|full-native-r-parity-ledger",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(was,reticulate::py_available(initialize=FALSE)))'
  pinned-python-boundaries:
    name: source boundary characterization / Python 1.2
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: "hard"
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Direct published-source boundary observations (not signoff)
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-source-boundaries",reporter="summary",stop_on_failure=TRUE)'
