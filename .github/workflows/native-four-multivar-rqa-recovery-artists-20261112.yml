name: Native four multivariate RQA and recovery source scientific artists
on:
  pull_request:
    paths:
      - "R/native-four-multivar-rqa-recovery-artists.R"
      - "R/native-source-diagnostic-frames.R"
      - "R/native-functional-inference-visuals.R"
      - "R/native-functional-recovery-evidence.R"
      - "tests/testthat/test-native-four-multivar-rqa-recovery-artists-20261112.R"
      - "tests/testthat/test-native-functional-inference-visuals.R"
      - "tests/testthat/test-native-functional-recovery-evidence.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_multivariate_iaaft_diagnostics.json"
      - "docs/source_contract_reviews/plot_multivariate_surrogate_nonlinearity.json"
      - "docs/source_contract_reviews/plot_rqa_metric_mean_bootstrap.json"
      - "docs/source_contract_reviews/plot_functional_recovery_summary.json"
      - ".github/workflows/native-four-multivar-rqa-recovery-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit 489/508 source ledger and twelve six-domain SHA256 review receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              encoding="utf-8",newline="") as f:
              gaps=list(csv.reader(f,strict=True))
          assert len(gaps)==204,len(gaps)
          assert all(len(r)==7 for r in gaps)
          assert len({r[0] for r in gaps[1:]})==203
          assert all(r[-1] in ("TRUE","FALSE") for r in gaps[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              encoding="utf-8",newline="") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              encoding="utf-8",newline="") as f:
              other=list(csv.DictReader(f))
          assert len(registry)>=179,len(registry)
          assert len({r["python_name"] for r in registry})==len(registry)
          fresh=(
              "plot_multivariate_iaaft_diagnostics",
              "plot_multivariate_surrogate_nonlinearity",
              "plot_rqa_metric_mean_bootstrap",
              "plot_functional_recovery_summary")
          inherited=(
              "multivariate_iaaft_diagnostics_frame",
              "functional_mixed_effects_variance_bootstrap_frame",
              "functional_recovery_frame",
              "functional_recovery_failure_frame",
              "functional_recovery_summary_frame",
              "function_on_scalar_reporting_text",
              "conformal_fpca_anomaly_reporting_text",
              "plot_functional_variance_decomposition")
          for name in fresh:
              (gap,)=tuple(x for x in gaps[1:] if x[0]==name)
              assert gap[-1]=="FALSE",name
          for name in fresh+inherited:
              (row,)=tuple(r for r in registry if r["python_name"]==name)
              assert row["independently_certified"]=="FALSE",name
              raw=(root/row["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row["review_record_sha256"],name
              data=json.loads(raw)
              assert data["independently_certified"] is False
              assert data["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in data["case_evidence"]}=={
                  "source_signature","accepted_input_domain",
                  "numerical_outputs","exception_semantics",
                  "returned_schema","scientific_estimand"},name
              for e in (data["native_files"]+data["case_evidence"]+
                        data.get("additional_regression_evidence",[])):
                  path=root/e["path"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==e["sha256"],path
          callable_gaps=sum(r[-1]=="TRUE" for r in gaps[1:])
          noncallable_gaps=sum(r["unresolved"]=="TRUE" for r in other)
          assert callable_gaps<=18,callable_gaps
          assert noncallable_gaps<=1,noncallable_gaps
          assert 508-callable_gaps-noncallable_gaps>=489
          print("489+/508 provisional source-reviewed; <=18 callable + <=1 noncallable; independent certification 0")
          PY
  native-r-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Four native multivariate RQA and recovery scientific source artist and legacy tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-four-multivar-rqa-recovery-artists-20261112|native-source-diagnostic-frames|native-functional-inference-visuals|native-functional-recovery-evidence|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Pinned Python 1.2 vs native R IAAFT, surrogate histogram, RQA and recovery artist geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          np<-reticulate::import("numpy")
          stopifnot(identical(as.character(np$__version__),"2.3.5"))
          testthat::test_local(".",
            filter="native-four-multivar-rqa-recovery-artists-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
