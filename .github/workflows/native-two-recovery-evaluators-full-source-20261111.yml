name: Native two recovery evaluators full Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-recovery-source-evaluators.R"
      - "tests/testthat/test-native-two-recovery-evaluators-full-source-20261111.R"
      - "tests/testthat/test-native-recovery-source-evaluators.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - ".github/workflows/native-two-recovery-evaluators-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Scientific hierarchical/inverse recovery R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native R scientific source and regression tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          for(test in c("native-two-recovery-evaluators-full-source-20261111",
            "native-recovery-source-evaluators"))
            testthat::test_local(".",filter=test,reporter="summary",
              stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - name: Verify authoritative source-gap and pinned review receipts
        if: runner.os == 'Linux'
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: Direct Python 1.2 hierarchical and inverse registration source / ubuntu
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5" "pandas" "scipy" "scikit-learn"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: All semantic source recovery values and metric/provenance fields
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          for(test in c("native-two-recovery-evaluators-full-source-20261111",
            "native-recovery-source-evaluators"))
            testthat::test_local(".",filter=test,reporter="summary",
              stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: python scripts/source_gap_inventory.py
