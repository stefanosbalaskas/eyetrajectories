name: Native R Python portable-result reader

on:
  pull_request:
    paths:
      - "R/native-python-portable-reader.R"
      - "R/native-full-parity-ledger.R"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "tests/testthat/test-native-python-portable-reader.R"
      - "tests/testthat/test-native-portable-parity-ledger.R"
      - ".github/workflows/native-r-parity-portable-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r-no-python:
    name: R-only parser and strict ledger / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::digest
      - name: No-Python NumPy header/parser validation
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); old <- reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="(?:native-portable-parity-ledger|native-python-portable-reader)",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(reticulate::py_available(initialize=FALSE),old))'

  python-generated-portable-fixtures:
    name: real Python 1.2 JSON/NPZ exports / Linux
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Python 1.2 oracle
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::digest
      - name: Cross-language Python-generated array/metadata checks
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="(?:native-portable-parity-ledger|native-python-portable-reader)",reporter="summary",stop_on_failure=TRUE)'
