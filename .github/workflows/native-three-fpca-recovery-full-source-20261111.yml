name: Native dense sparse and joint FPCA recovery Python 1.2 source
on:
  pull_request:
    paths:
      - "R/native-sparse-known-truth-recovery.R"
      - "R/native-fpca-known-truth-recovery.R"
      - "R/native-sparse-mfpca-known-truth-recovery.R"
      - "R/native-fpca-multicomponent-recovery.R"
      - "tests/testthat/test-native-three-fpca-recovery-source-20261111.R"
      - "tests/testthat/test-native-fpca-known-truth-recovery.R"
      - "tests/testthat/test-native-fpca-multicomponent-recovery-source.R"
      - "tests/testthat/test-native-sparse-known-truth-recovery.R"
      - "tests/testthat/test-native-sparse-mfpca-known-truth-recovery.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - ".github/workflows/native-three-fpca-recovery-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Dense sparse joint recovery native R / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native full scientific recovery source and inherited regression tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          for(test in c("native-three-fpca-recovery-source-20261111",
              "native-fpca-known-truth-recovery",
              "native-fpca-multicomponent-recovery-source",
              "native-sparse-known-truth-recovery",
              "native-sparse-mfpca-known-truth-recovery"))
            testthat::test_local(".",filter=test,reporter="summary",
              stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - name: Verify authoritative gap ledger and six-domain review receipts
        if: runner.os == 'Linux'
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: Fifteen typed Python 1.2 dense sparse recovery results / ubuntu
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5" "pandas" "scipy" "scikit-learn"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Exact full source metric tables and provenance for fifteen cases
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          for(test in c("native-three-fpca-recovery-source-20261111",
              "native-fpca-known-truth-recovery",
              "native-fpca-multicomponent-recovery-source",
              "native-sparse-known-truth-recovery",
              "native-sparse-mfpca-known-truth-recovery"))
            testthat::test_local(".",filter=test,reporter="summary",
              stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: python scripts/source_gap_inventory.py
