name: Python 1.2 bridge integration

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
      RETICULATE_USE_MANAGED_VENV: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matching Python backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "eyetrajectoriespy==1.2.0"
      - name: Verify frozen Python 1.2.0 mathematical reference
        run: python scripts/check_python_native_reference.py
      - name: Verify independent Phase 3 transfer entropy oracle
        run: python scripts/check_phase3_discrete_oracle.py
      - name: Verify independent Phase 3 analytic variance by Monte Carlo
        run: python scripts/check_phase3_analytic_variance.py
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: test
      - name: Choose the installed Python interpreter
        run: echo "RETICULATE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run Python-backed tests
        run: Rscript -e 'testthat::test_local(".", filter = "python-integration", reporter = "summary")'
