name: Native mixed reporting Python repr source contract
on:
  pull_request:
    paths:
      - "R/native-mixed-model-source-text.R"
      - "tests/testthat/test-native-mixed-report-string-boundaries.R"
      - ".github/workflows/native-mixed-report-python-string.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: Native mixed report labels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Parse and test mixed reporting scope
        shell: bash
        run: |
          Rscript -e 'for(p in c("R/native-mixed-model-source-text.R","tests/testthat/test-native-mixed-model-source-text.R","tests/testthat/test-native-mixed-report-string-boundaries.R")) invisible(parse(file=p))'
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); before<-reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-mixed-(model-source-text|report-string-boundaries)",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(before,reticulate::py_available(initialize=FALSE)))'
  pinned-python:
    name: Frozen Python 1.2 exact report string comparison
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Exact mixed reporter comparison against Python 1.2
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-mixed-(model-source-text|report-string-boundaries)",reporter="summary",stop_on_failure=TRUE)'
