name: Native four predictive FPCR and bootstrap source scientific artists
on:
  pull_request:
    paths:
      - "R/native-predictive-visual-audits.R"
      - "R/native-fpcr-three-predictive-artists-source.R"
      - "tests/testthat/test-native-three-fpcr-cv-truncation-artists-20261112.R"
      - "tests/testthat/test-native-predictive-visual-audits.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_fpca_regression_cv.json"
      - "docs/source_contract_reviews/plot_nested_fpca_regression_cv.json"
      - "docs/source_contract_reviews/plot_fpca_wild_bootstrap_truncation_scan.json"
      - "docs/source_contract_reviews/plot_functional_mixed_effects_bootstrap_comparison.json"
      - ".github/workflows/native-four-predictive-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 468/508 provisional ledger and all four source SHA256 reviews
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              newline="",encoding="utf-8") as f:
              gaps=list(csv.reader(f,strict=True))
          assert len(gaps)==204,len(gaps)
          assert all(len(x)==7 for x in gaps),[
              (i,len(x),x[0]) for i,x in enumerate(gaps) if len(x)!=7]
          assert len({x[0] for x in gaps[1:]})==203
          assert all(x[-1] in ("TRUE","FALSE") for x in gaps[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              newline="",encoding="utf-8") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              newline="",encoding="utf-8") as f:
              nc=list(csv.DictReader(f))
          assert len(registry)>=158,len(registry)
          assert len({x["python_name"] for x in registry})==len(registry)
          names=(
              "plot_fpca_regression_cv",
              "plot_nested_fpca_regression_cv",
              "plot_fpca_wild_bootstrap_truncation_scan",
              "plot_functional_mixed_effects_bootstrap_comparison")
          for name in names:
              (gap,)=tuple(x for x in gaps[1:] if x[0]==name)
              assert gap[-1]=="FALSE",name
              (rec,)=tuple(x for x in registry if x["python_name"]==name)
              assert rec["independently_certified"]=="FALSE"
              review_file=root/rec["review_record_path"]
              original=review_file.read_bytes()
              assert hashlib.sha256(original).hexdigest()==rec["review_record_sha256"],name
              review=json.loads(original)
              assert review["independently_certified"] is False
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {e["kind"] for e in review["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for entry in (review["native_files"]+review["case_evidence"]+
                            review.get("additional_regression_evidence",[])):
                  p=root/entry["path"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==entry["sha256"],p
          callable_gaps=sum(x[-1]=="TRUE" for x in gaps[1:])
          noncallable_gaps=sum(x["unresolved"]=="TRUE" for x in nc)
          assert callable_gaps<=39,callable_gaps
          assert noncallable_gaps<=1,noncallable_gaps
          assert 508-callable_gaps-noncallable_gaps>=468
          print("468+/508 provisional developer-scoped; callable gaps <=39; noncallable <=1; 0 independently certified")
          PY
  native-r-three-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Check native four predictive FPCR and bootstrap artist contracts
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-three-fpcr-cv-truncation-artists-20261112|native-predictive-visual-audits|native-fpcr-two-cv-strict-source-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Differential source CV, outer-fold, truncation and mixed-effect Matplotlib artists
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-three-fpcr-cv-truncation-artists-20261112|native-predictive-visual-audits",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
