name: Native FPCR Monte Carlo and simultaneous interval source artists
on:
  pull_request:
    paths:
      - "R/native-wild-monte-carlo-source-contracts.R"
      - "R/native-wild-two-scientific-artists.R"
      - "tests/testthat/test-native-wild-two-scientific-artists-20261112.R"
      - "tests/testthat/test-native-wild-monte-carlo-source-contracts.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/plot_fpca_wild_bootstrap_monte_carlo_diagnostics.json"
      - "docs/source_contract_reviews/plot_fpca_wild_bootstrap_simultaneous_interval.json"
      - "docs/source_contract_reviews/fpca_wild_bootstrap_family_test_monte_carlo_diagnostics.json"
      - ".github/workflows/native-wild-two-scientific-artists-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 459/508 provisional ledger and inherited six-domain SHA256s
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root=Path(".")
          with (root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(
              encoding="utf-8",newline="") as f:
              gaps=list(csv.reader(f,strict=True))
          assert len(gaps)==204,len(gaps)
          assert all(len(r)==7 for r in gaps),[(i,len(r)) for i,r in enumerate(gaps)]
          assert len({r[0] for r in gaps[1:]})==203
          assert all(r[-1] in ("TRUE","FALSE") for r in gaps[1:])
          with (root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(
              encoding="utf-8",newline="") as f:
              registry=list(csv.DictReader(f))
          with (root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(
              encoding="utf-8",newline="") as f:
              noncallable=list(csv.DictReader(f))
          assert len({r["python_name"] for r in registry})==len(registry)
          targets=("plot_fpca_wild_bootstrap_monte_carlo_diagnostics",
                   "plot_fpca_wild_bootstrap_simultaneous_interval")
          inherited=("fpca_wild_bootstrap_family_test_monte_carlo_diagnostics",)
          for name in targets+inherited:
              (review,)=tuple(r for r in registry if r["python_name"]==name)
              assert review["independently_certified"]=="FALSE"
              raw=(root/review["review_record_path"]).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==review["review_record_sha256"]
              record=json.loads(raw)
              assert record["independently_certified"] is False
              assert record["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert {r["kind"] for r in record["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
              for entry in (record["native_files"]+record["case_evidence"]+
                            record.get("additional_regression_evidence",[])):
                  src=root/entry["path"]
                  assert hashlib.sha256(src.read_bytes()).hexdigest()==entry["sha256"],src
          for name in targets:
              (gap,)=tuple(g for g in gaps[1:] if g[0]==name)
              assert gap[-1]=="FALSE",name
          count=sum(x[-1]=="TRUE" for x in gaps[1:])
          other=sum(r["unresolved"]=="TRUE" for r in noncallable)
          assert count<=48,count
          assert other<=1,other
          assert 508-count-other>=459
          print("459/508 provisional author-scoped reviews; 48 callable + 1 noncallable gaps; zero independently certified")
          PY
  three-os-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Test genuine wild-bootstrap precision and simultaneous source artists
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-wild-two-scientific-artists-20261112|native-wild-monte-carlo-source-contracts|native-two-wild-postcalibrators-full-source-20261111|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Compare exact Matplotlib vertical segments and fixed family geometry
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-wild-two-scientific-artists-20261112|native-wild-monte-carlo-source-contracts",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
