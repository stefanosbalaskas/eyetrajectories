name: Native recurrence network complete frozen source graph contract
on:
  pull_request:
    paths:
      - "R/native-recurrence-network-source.R"
      - "R/native-nonlinear-recurrence.R"
      - "tests/testthat/test-native-recurrence-network-full-source-20261111.R"
      - "tests/testthat/test-native-recurrence-source-contract.R"
      - "tests/testthat/test-native-recurrence-sparse-source.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/recurrence_network.json"
      - ".github/workflows/native-recurrence-network-full-source-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify six-domain SHA256 review receipts and 398/508 census
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path(".")
          gaps=list(csv.DictReader((root/"inst/extdata/native_source_contract_gaps_stage22.csv").open(encoding="utf-8",newline="")))
          kinds=list(csv.DictReader((root/"inst/extdata/native_nonfunction_source_gaps_v1.csv").open(encoding="utf-8",newline="")))
          receipts=list(csv.DictReader((root/"inst/extdata/reviewed_source_contract_closures_v1.csv").open(encoding="utf-8",newline="")))
          assert len(gaps)==203 and len(kinds)==1
          missing=sum(row["unresolved_source_gap"]=="TRUE" for row in gaps)
          noncallable=sum(row["unresolved"]=="TRUE" for row in kinds)
          assert missing<=109 and noncallable==1,(missing,noncallable)
          assert 508-missing-noncallable>=398
          source,=[row for row in gaps if row["python_name"]=="recurrence_network"]
          assert source["unresolved_source_gap"]=="FALSE"
          # Adjacent plotting and broader PyMatplotlib return contracts remain open.
          graphic,=[row for row in gaps if row["python_name"]=="plot_recurrence_network_degree"]
          assert graphic["unresolved_source_gap"]=="TRUE"
          rec,=[row for row in receipts if row["python_name"]=="recurrence_network"]
          assert rec["independently_certified"]=="FALSE"
          raw=(root/rec["review_record_path"]).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==rec["review_record_sha256"]
          review=json.loads(raw)
          assert review["python_name"]=="recurrence_network"
          assert review["independently_certified"] is False
          assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
          assert {x["kind"] for x in review["case_evidence"]}=={
              "source_signature","accepted_input_domain","numerical_outputs",
              "exception_semantics","returned_schema","scientific_estimand"}
          for e in review["native_files"]+review["case_evidence"]:
              actual=hashlib.sha256((root/e["path"]).read_bytes()).hexdigest()
              assert actual==e["sha256"],e["path"]
          print(f"{508-missing-noncallable}/508 author-reviewed source contracts; "
                f"{missing} callable, {noncallable} noncallable unresolved; "
                "no independent certification")
          PY
  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::Matrix
      - name: Native source network, sparse, legacy and source schema tests
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-recurrence-network-full-source-20261111|native-recurrence-source-contract|native-recurrence-sparse-source",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  frozen-python:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::Matrix
      - name: Frozen Python typed CSR RecurrenceResult / NetworkResult oracle
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-recurrence-network-full-source-20261111|native-recurrence-source-contract|native-recurrence-sparse-source",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
