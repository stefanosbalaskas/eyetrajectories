name: Native FPCR CV and mixed-effect reporting frozen Python 1.2
on:
  pull_request:
    paths:
      - "R/native-inference-reporting-extensions.R"
      - "R/native-mixed-model-source-text.R"
      - "tests/testthat/test-native-fpcr-cv-mixed-reporting-full-source.R"
      - "tests/testthat/test-native-inference-reporting-extensions.R"
      - "tests/testthat/test-native-mixed-model-source-text.R"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "docs/source_contract_reviews/**"
      - ".github/workflows/native-fpcr-cv-mixed-reporting-full-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-r:
    name: FPCR CV and mixed source reports R / \${{ matrix.os }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Validate native scientific source report texts
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-fpcr-cv-mixed-reporting-full-source",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          testthat::test_local(".",filter="native-inference-reporting-extensions",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          testthat::test_local(".",filter="native-mixed-model-source-text",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - name: Verify SHA256 review receipts and authoritative 508-export inventory
        if: runner.os == 'Linux'
        run: |
          python scripts/source_gap_inventory.py
          python -m unittest discover -s tests -p 'test_source_gap_inventory.py'
  frozen-python:
    name: FPCR CV and mixed source reports typed Python 1.2 / ubuntu
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0" "numpy==2.3.5" "pandas"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare 21 independent source text cases against frozen Python 1.2
        shell: bash
        env:
          RETICULATE_PYTHON: \${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-fpcr-cv-mixed-reporting-full-source",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          testthat::test_local(".",filter="native-inference-reporting-extensions",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          testthat::test_local(".",filter="native-mixed-model-source-text",
            reporter="summary",stop_on_failure=TRUE,stop_on_warning=TRUE)
          RSCRIPT
      - run: python scripts/source_gap_inventory.py
