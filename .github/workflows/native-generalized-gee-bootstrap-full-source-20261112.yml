name: Native generalized GEE participant bootstrap full frozen-source contract
on:
  pull_request:
    paths:
      - "R/native-generalized-gee-bootstrap.R"
      - "R/native-generalized-gee-source-scientific-record.R"
      - "R/native-generalized-gee-solver.R"
      - "tests/testthat/test-native-generalized-gee-bootstrap-full-source-20261112.R"
      - "docs/source_contract_reviews/bootstrap_generalized_function_on_scalar_coefficients.json"
      - "docs/source_contract_reviews/fit_generalized_function_on_scalar_regression.json"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - ".github/workflows/native-generalized-gee-bootstrap-full-source-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  frozen-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile all 508 exports and exact SHA256 source receipts
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          base=Path(".")
          def rows(path):
              with (base/path).open(encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          gaps=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          non=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reg=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          assert len(gaps)==203
          assert len(non)==1
          assert sum(g["unresolved_source_gap"]=="TRUE" for g in gaps)==93
          assert sum(n["unresolved"]=="TRUE" for n in non)==1
          assert 508-93-1==414
          for name in ("bootstrap_generalized_function_on_scalar_coefficients",
                       "fit_generalized_function_on_scalar_regression"):
              (gap,)=tuple(g for g in gaps if g["python_name"]==name)
              assert gap["unresolved_source_gap"]=="FALSE"
              (r,)=tuple(x for x in reg if x["python_name"]==name)
              assert r["independently_certified"]=="FALSE"
              payload=(base/r["review_record_path"]).read_bytes()
              assert hashlib.sha256(payload).hexdigest()==r["review_record_sha256"],name
              review=json.loads(payload)
              assert review["python_name"]==name
              assert review["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
              assert review["independently_certified"] is False
              for field in review["native_files"]+review["case_evidence"]:
                  p=base/field["path"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==field["sha256"],p
              assert {e["kind"] for e in review["case_evidence"]}=={
                  "source_signature","accepted_input_domain","numerical_outputs",
                  "exception_semantics","returned_schema","scientific_estimand"}
          print("414/508 developer reviewed; 93 callable + 1 noncallable gaps; independent certifications 0")
          PY

  native-r:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native 100 participant-refit scientific source schema and guards
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",
            filter="native-generalized-gee-bootstrap-full-source-20261112|native-generalized-gee-bootstrap|native-generalized-gee-fit-workflow-full-source-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT

  frozen-python-1-2:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Four exact Python 1.2 GEE whole-participant bootstrap oracles
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",
            filter="native-generalized-gee-bootstrap-full-source-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
