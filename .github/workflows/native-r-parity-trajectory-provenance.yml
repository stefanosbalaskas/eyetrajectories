name: Native R trajectory provenance and R snapshots

on:
  pull_request:
    paths:
      - "R/native-trajectories.R"
      - "R/native-trajectory-provenance.R"
      - "R/native-preprocessing-distances.R"
      - "R/native-planar-geometry-parity.R"
      - "NAMESPACE"
      - "man/**"
      - "tests/testthat/test-native-trajectory-provenance.R"
      - ".github/workflows/native-r-parity-trajectory-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r-no-python:
    name: R only / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Native trajectory provenance and snapshot integrity
        shell: bash
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); before <- reticulate::py_available(initialize=FALSE); testthat::test_local(".",filter="native-trajectory-provenance",reporter="summary",stop_on_failure=TRUE); stopifnot(identical(reticulate::py_available(initialize=FALSE),before))'
      - name: Full native stage 2/3/4 backward-compatibility check
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE); testthat::test_local(".",filter="native-planar-geometry-parity|native-preprocessing-distances|native-distance-contracts",reporter="summary",stop_on_failure=TRUE)
          RSCRIPT

  python-reference-oracle:
    name: provenance semantics / Python 1.2 (Linux)
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Set Python 3.12 reference
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned stable Python reference
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
      - name: Compare Python dataclass with_values/subset/provenance semantics
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript -e 'pkgload::load_all(".",quiet=TRUE); stopifnot(identical(et_python_version(),"1.2.0")); testthat::test_local(".",filter="native-trajectory-provenance",reporter="summary",stop_on_failure=TRUE)'
