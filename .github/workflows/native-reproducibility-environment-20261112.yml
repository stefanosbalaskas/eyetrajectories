name: Native scientific environment capture & frozen Python 1.2 schema witness
on:
  pull_request:
    paths:
      - "R/native-source-environment.R"
      - "R/native-source-environment-scientific-record-20261112.R"
      - "tests/testthat/test-native-environment-scientific-crosswalk-20261112.R"
      - "docs/source_contract_reviews/capture_environment.json"
      - "docs/native-reproducibility-source-environment-20261112.md"
      - "inst/extdata/native_scoped_environment_subcontracts_20261112.csv"
      - "inst/extdata/native_source_contract_gaps_stage22.csv"
      - "inst/extdata/native_nonfunction_source_gaps_v1.csv"
      - "inst/extdata/reviewed_source_contract_closures_v1.csv"
      - "man/etr_capture_environment.Rd"
      - ".github/workflows/native-reproducibility-environment-20261112.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-hash-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 506 scoped ledger, live SHA256 and openly unqualified Python environment subcontracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib
          root=Path(".")
          def rows(path):
              with (root/path).open("r",encoding="utf-8",newline="") as f:
                  return list(csv.DictReader(f))
          gaps=rows("inst/extdata/native_source_contract_gaps_stage22.csv")
          classes=rows("inst/extdata/native_nonfunction_source_gaps_v1.csv")
          reviews=rows("inst/extdata/reviewed_source_contract_closures_v1.csv")
          subs=rows("inst/extdata/native_scoped_environment_subcontracts_20261112.csv")
          fdapy=rows("inst/extdata/native_scoped_fdapy_submethod_gaps_20261112.csv")
          assert len(gaps)==203,len(gaps)
          assert len(reviews)>=196,len(reviews)
          assert len(set(x["python_name"] for x in reviews))==len(reviews)
          unresolved=sum(x["unresolved_source_gap"]=="TRUE" for x in gaps)
          unresolved_class=sum(x["unresolved"]=="TRUE" for x in classes)
          assert unresolved==2,unresolved
          assert unresolved_class==0,unresolved_class
          assert 508-unresolved-unresolved_class==506
          for name in ("fit_sparse_fpca_fdapy","fit_elastic_fpca"):
              assert next(x for x in gaps if x["python_name"]==name)["unresolved_source_gap"]=="TRUE"
          assert next(x for x in gaps if x["python_name"]=="capture_environment")["unresolved_source_gap"]=="FALSE"
          assert next(x for x in fdapy if x["source_stage"]=="UFPCA_fit_PS_LP_mean_and_covariance")["source_gap_open"]=="TRUE"
          s={x["subcontract"]:x for x in subs}
          assert s["native_R_environment_capture"]["source_gap_open"]=="FALSE"
          assert s["externally_attested_Python_1_2_environment"]["source_gap_open"]=="FALSE"
          assert s["automatic_actual_Python_runtime_capture_from_native_R_without_Python"]["source_gap_open"]=="TRUE"
          assert s["Python_specific_git_subprocess_platform_and_exception_identity"]["source_gap_open"]=="TRUE"
          (e,)=tuple(x for x in reviews if x["python_name"]=="capture_environment")
          assert e["independently_certified"]=="FALSE"
          raw=(root/e["review_record_path"]).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==e["review_record_sha256"]
          obj=json.loads(raw)
          assert obj["independently_certified"] is False
          assert obj["frozen_python_commit"]=="c1cd95ad718327550f7e55393ff38582872f7a94"
          assert {x["kind"] for x in obj["case_evidence"]}=={
              "source_signature","accepted_input_domain","numerical_outputs",
              "exception_semantics","returned_schema","scientific_estimand"}
          assert "cannot" in obj["reviewer_statement"].lower()
          for datum in obj["native_files"]+obj["case_evidence"]+obj.get("additional_regression_evidence",[]):
              f=root/datum["path"]
              assert hashlib.sha256(f.read_bytes()).hexdigest()==datum["sha256"],f
          print("506/508 provisional source scientific R contracts; two callable gaps remain; Python-only process capture still open; independent full certifications zero")
          PY
  native-r-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ET_RUN_PYTHON_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Parse native R source and strict regression/testthat suite
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          parse("R/native-source-environment.R")
          parse("R/native-source-environment-scientific-record-20261112.R")
          parse("tests/testthat/test-native-environment-scientific-crosswalk-20261112.R")
          pkgload::load_all(".",quiet=TRUE)
          testthat::test_local(".",filter="native-environment-scientific-crosswalk-20261112|full-native-r-parity-ledger",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
  actual-frozen-Python-runtime-source-witness:
    runs-on: ubuntu-latest
    env:
      ET_RUN_PYTHON_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - name: Install genuine frozen Python source package
        run: python -m pip install "eyetrajectoriespy==1.2.0"
      - name: Witness real Python package/environment and schema via public frozen function
        run: |
          python - <<'PY'
          import eyetrajectoriespy as et
          from importlib.metadata import version
          assert version("eyetrajectoriespy")=="1.2.0"
          p=et.capture_environment()
          assert list(p)==["schema_version","captured_at_utc","package",
              "python","platform","dependencies","optional_backends",
              "numerical_thread_environment"]
          assert p["schema_version"]==1
          assert p["package"]["name"]=="eyetrajectoriespy"
          assert p["package"]["version"]=="1.2.0"
          assert p["python"]["implementation"]
          assert p["python"]["executable"]
          assert list(p["dependencies"])==["numpy","pandas","scipy",
              "scikit-learn","matplotlib","statsmodels"]
          assert list(p["optional_backends"])==["scikit-fda","FDApy","fdasrsf"]
          assert list(p["numerical_thread_environment"])==[
              "OMP_NUM_THREADS","OPENBLAS_NUM_THREADS",
              "MKL_NUM_THREADS","NUMEXPR_NUM_THREADS"]
          print("Real frozen Python capture_environment public schema witnessed; R cannot manufacture these Python distribution versions")
          PY
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::testthat
            any::reticulate
      - name: Validate actual Python capture and preserve it without invoking Python from R native method
        shell: bash
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          Rscript - <<'RSCRIPT'
          pkgload::load_all(".",quiet=TRUE)
          stopifnot(identical(et_python_version(),"1.2.0"))
          testthat::test_local(".",filter="native-environment-scientific-crosswalk-20261112",
            reporter="summary",stop_on_failure=TRUE)
          RSCRIPT
